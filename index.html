<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마음온(On) - 3D AI 심리 상담소</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
* {
  box-sizing: border-box;
  font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}

body {
  background: radial-gradient(circle at top left, #dbeafe, #f3e8ff 55%, #ffedd5);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  padding: 12px;
}

.app-container {
  width: 100%;
  max-width: 450px;
  height: 88vh;
  max-height: 780px;
  background: #fff;
  border-radius: 30px;
  box-shadow: 0 18px 45px rgba(30,41,59,.14);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
  border: 1px solid #f1f5f9;
}

/* 캐릭터 선택 화면 */

.select-screen {
  flex: 1;
  padding: 24px 18px;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  background: linear-gradient(180deg,#f5f3ff,#fffaf5);
}

.select-header {
  text-align: center;
  margin-bottom: 18px;
}

.select-header h2 {
  margin: 0 0 7px;
  font-size: 21px;
  color: #334155;
  letter-spacing: -.5px;
}

.select-header p {
  margin: 0;
  font-size: 13px;
  color: #64748b;
  line-height: 1.5;
}

.char-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  flex: 1;
}

.char-card {
  background: #fff;
  border: 2px solid #f1f5f9;
  border-radius: 22px;
  padding: 12px 10px 14px;
  cursor: pointer;
  transition: .25s;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  box-shadow: 0 4px 14px rgba(0,0,0,.04);
}

.char-card:hover {
  transform: translateY(-4px);
  border-color: #a5b4fc;
  box-shadow: 0 12px 24px rgba(99,102,241,.13);
}

.card-3d-preview {
  width: 126px;
  height: 126px;
  border-radius: 20px;
  margin-bottom: 10px;
  overflow: hidden;
  position: relative;
}

.card-3d-preview canvas {
  display: block;
}

.card-badge {
  font-size: 10.5px;
  font-weight: bold;
  padding: 4px 9px;
  border-radius: 12px;
  margin-bottom: 6px;
}

.char-card h3 {
  margin: 0 0 4px;
  font-size: 16px;
  color: #0f172a;
}

.char-card p {
  margin: 0;
  font-size: 11.5px;
  color: #64748b;
  line-height: 1.4;
  word-break: keep-all;
}

/* 채팅 화면 */

.chat-screen {
  display: none;
  flex-direction: column;
  height: 100%;
}

.top-bar {
  padding: 13px 16px;
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 5;
}

.top-bar-title {
  display: flex;
  align-items: center;
  gap: 6px;
}

.top-bar-title h3 {
  margin: 0;
  font-size: 16px;
}

.top-bar-title span {
  font-size: 10.5px;
  background: rgba(255,255,255,.22);
  padding: 3px 8px;
  border-radius: 10px;
}

.top-bar-actions {
  display: flex;
  gap: 6px;
}

.change-btn {
  background: rgba(255,255,255,.25);
  border: none;
  color: white;
  font-size: 10.5px;
  padding: 7px 9px;
  border-radius: 14px;
  cursor: pointer;
  font-weight: bold;
}

.change-btn:hover {
  background: rgba(255,255,255,.4);
}

/* 3D 무대 */

.stage-3d-wrapper {
  height: 245px;
  width: 100%;
  position: relative;
  border-bottom: 1px solid #e2e8f0;
  overflow: hidden;
  cursor: grab;
  touch-action: pan-y;
}

.stage-3d-wrapper:active {
  cursor: grabbing;
}

#threeCanvasContainer {
  width: 100%;
  height: 100%;
}

#threeCanvasContainer canvas {
  display: block;
}

.stage-hint {
  position: absolute;
  top: 10px;
  left: 14px;
  font-size: 10.5px;
  color: rgba(30,41,59,.7);
  background: rgba(255,255,255,.8);
  padding: 4px 9px;
  border-radius: 10px;
  pointer-events: none;
  z-index: 2;
}

.status-pill {
  position: absolute;
  bottom: 10px;
  right: 14px;
  background: rgba(255,255,255,.94);
  color: #334155;
  font-size: 11px;
  padding: 5px 11px;
  border-radius: 14px;
  box-shadow: 0 3px 10px rgba(0,0,0,.08);
  font-weight: bold;
  pointer-events: none;
  z-index: 2;
}

/* 대화창 */

.chat-box {
  flex: 1;
  padding: 16px 14px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: #f8fafc;
}

.msg-row {
  display: flex;
  flex-direction: column;
  max-width: 82%;
}

.msg-row.bot-row {
  align-self: flex-start;
}

.msg-row.user-row {
  align-self: flex-end;
  align-items: flex-end;
}

.sender-label {
  font-size: 11px;
  color: #64748b;
  margin: 0 0 4px 6px;
  font-weight: bold;
}

.bubble {
  padding: 11px 15px;
  border-radius: 18px;
  font-size: 13.8px;
  line-height: 1.55;
  word-break: keep-all;
  box-shadow: 0 2px 8px rgba(0,0,0,.04);
}

.bot-bubble {
  background: #fff;
  color: #1e293b;
  border-top-left-radius: 4px;
  border: 1px solid #e2e8f0;
}

.user-bubble {
  color: #fff;
  border-top-right-radius: 4px;
}

.tag {
  display: inline-block;
  font-size: 10px;
  font-weight: bold;
  padding: 2px 7px;
  border-radius: 6px;
  margin-bottom: 5px;
  background: #f1f5f9;
  color: #475569;
}

.danger-bubble {
  background: #fff5f5;
  border: 1.5px solid #ff6b6b;
  color: #c92a2a;
}

.danger-bubble .tag {
  background: #ff6b6b;
  color: white;
}

.typing-dots {
  display: flex;
  gap: 5px;
  padding: 13px 16px;
  align-items: center;
}

.dot {
  width: 7px;
  height: 7px;
  background: #94a3b8;
  border-radius: 50%;
  animation: bounce 1.3s infinite ease-in-out;
}

.dot:nth-child(2) { animation-delay: .2s; }
.dot:nth-child(3) { animation-delay: .4s; }

@keyframes bounce {
  0%,80%,100% { transform: scale(.7); opacity: .5; }
  40% { transform: scale(1.15); opacity: 1; }
}

.input-area {
  display: flex;
  padding: 11px 12px;
  background: #fff;
  border-top: 1px solid #e2e8f0;
  gap: 8px;
}

input {
  flex: 1;
  min-width: 0;
  border: 1.5px solid #cbd5e1;
  border-radius: 22px;
  padding: 10px 16px;
  font-size: 14px;
  outline: none;
  transition: .2s;
}

input:focus {
  border-color: #6366f1;
}

.send-btn {
  border: none;
  border-radius: 22px;
  padding: 0 18px;
  color: white;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
}

.send-btn:disabled {
  opacity: .5;
  cursor: not-allowed;
}

@media(max-height:650px) {
  .app-container {
    height: 95vh;
  }
  .stage-3d-wrapper {
    height: 190px;
  }
  .card-3d-preview {
    width: 105px;
    height: 105px;
  }
}
</style>
</head>

<body>
<div class="app-container">

  <div class="select-screen" id="selectScreen">
    <div class="select-header">
      <h2>오늘 누구랑 이야기할까?</h2>
      <p>검증된 상담 매뉴얼을 바탕으로<br>네 마음을 따뜻하게 들어줄 친구를 선택해 줘!</p>
    </div>

    <div class="char-grid">

      <div class="char-card" onclick="selectCharacter('haru')">
        <div class="card-3d-preview" style="background:linear-gradient(135deg,#dbeafe,#bae6fd)" id="preview-haru"></div>
        <span class="card-badge" style="background:#bae6fd;color:#0369a1">동갑내기 단짝 친구</span>
        <h3>하루</h3>
        <p>"무조건 네 편이야! 편하게 반말로 다 털어놔."</p>
      </div>

      <div class="char-card" onclick="selectCharacter('teacher')">
        <div class="card-3d-preview" style="background:linear-gradient(135deg,#dcfce7,#bbf7d0)" id="preview-teacher"></div>
        <span class="card-badge" style="background:#bbf7d0;color:#15803d">다정한 상담 선생님</span>
        <h3>선생님</h3>
        <p>"혼자 고민하지 마세요. 선생님이 차분히 들어줄게요."</p>
      </div>

      <div class="char-card" onclick="selectCharacter('bambi')">
        <div class="card-3d-preview" style="background:linear-gradient(135deg,#ffedd5,#fed7aa)" id="preview-bambi"></div>
        <span class="card-badge" style="background:#fed7aa;color:#c2410c">말랑한 아기 강아지</span>
        <h3>밤비</h3>
        <p>"꼬리 흔들며 기다렸어! 오늘 무슨 일 있었어?"</p>
      </div>

      <div class="char-card" onclick="selectCharacter('luna')">
        <div class="card-3d-preview" style="background:linear-gradient(135deg,#f3e8ff,#e9d5ff)" id="preview-luna"></div>
        <span class="card-badge" style="background:#e9d5ff;color:#7e22ce">차분한 달빛 고양이</span>
        <h3>루나</h3>
        <p>"복잡한 머릿속을 차분하게 정리해 줄게냥."</p>
      </div>

    </div>
  </div>

  <div class="chat-screen" id="chatScreen">

    <div class="top-bar" id="topBar">
      <div class="top-bar-title">
        <h3 id="headerName">하루</h3>
        <span id="headerRole">동갑내기 단짝</span>
      </div>
      <div class="top-bar-actions">
        <button class="change-btn" onclick="clearChatHistory()">대화 초기화</button>
        <button class="change-btn" onclick="goBack()">캐릭터 바꾸기</button>
      </div>
    </div>

    <div class="stage-3d-wrapper" id="stageWrapper">
      <div class="stage-hint">↔ 좌우로 움직이면 입체로 반응해요</div>
      <div id="threeCanvasContainer"></div>
      <div class="status-pill" id="statusPill">● 이야기 듣는 중</div>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="인사나 고민을 편하게 적어봐..." onkeypress="if(event.key==='Enter') sendMessage()">
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">전송</button>
    </div>

  </div>
</div>

<script>

/* ==========================================
   캐릭터 대화 데이터
========================================== */

const characters = {

  fallback:[

/* ==========================================
   3D 캐릭터 제작 도구
========================================== */

function build3DCharacterMesh(type) {

  const group = new THREE.Group();

  const material = (color, roughness=.65) =>
    new THREE.MeshStandardMaterial({
      color,
      roughness,
      metalness:0
    });

  const sphere = (parent, color, position, scale) => {
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(1,32,32),
      material(color)
    );
    mesh.position.set(...position);
    mesh.scale.set(...scale);
    parent.add(mesh);
    return mesh;
  };

  const box = (parent,color,position,scale) => {
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(...scale),
      material(color)
    );
    mesh.position.set(...position);
    parent.add(mesh);
    return mesh;
  };

  const cylinder = (parent,color,position,r1,r2,height,rotation=[0,0,0]) => {
    const mesh = new THREE.Mesh(
      new THREE.CylinderGeometry(r1,r2,height,32),
      material(color)
    );
    mesh.position.set(...position);
    mesh.rotation.set(...rotation);
    parent.add(mesh);
    return mesh;
  };

  const headGroup = new THREE.Group();
  headGroup.position.y=.38;
  group.add(headGroup);

  /* 얼굴 공통 요소 */

  function addHumanFace(skin) {

    sphere(headGroup,skin,[0,0,0],[.78,.82,.68]);

    // 눈
    [-.29,.29].forEach(x=>{
      sphere(headGroup,0xffffff,[x,-.04,.61],[.135,.17,.065]);
      sphere(headGroup,0x382a28,[x+.015,-.035,.67],[.075,.105,.045]);
      sphere(headGroup,0xffffff,[x+.035,.02,.708],[.026,.03,.018]);
    });

    // 눈썹
    [-.29,.29].forEach((x,i)=>{
      const brow = new THREE.Mesh(
        new THREE.TorusGeometry(.105,.018,8,24,Math.PI),
        material(0x684c3c)
      );
      brow.position.set(x,.18,.63);
      brow.rotation.z=i===0?.12:-.12;
      headGroup.add(brow);
    });

    // 코
    sphere(headGroup,0xf3b6a5,[0,-.18,.67],[.055,.045,.035]);

    // 입
    const mouth = new THREE.Mesh(
      new THREE.TorusGeometry(.07,.018,8,20,Math.PI),
      material(0xb86b6b)
    );
    mouth.position.set(0,-.29,.65);
    mouth.rotation.z=Math.PI;
    headGroup.add(mouth);

    // 볼터치
    [-1,1].forEach(dir=>{
      const cheek = new THREE.Mesh(
        new THREE.SphereGeometry(1,24,24),
        new THREE.MeshBasicMaterial({
          color:0xff9a9a,
          transparent:true,
          opacity:.34
        })
      );
      cheek.position.set(dir*.48,-.2,.61);
      cheek.scale.set(.16,.09,.025);
      headGroup.add(cheek);
    });
  }

  function addAnimalFace(furColor,eyeColor=0x30251f) {

    sphere(headGroup,furColor,[0,0,0],[.82,.77,.68]);

    [-.29,.29].forEach(x=>{
      sphere(headGroup,0xffffff,[x,-.04,.61],[.14,.16,.07]);
      sphere(headGroup,eyeColor,[x,-.03,.67],[.078,.105,.045]);
      sphere(headGroup,0xffffff,[x+.025,.025,.708],[.027,.03,.018]);
    });

    [-1,1].forEach(dir=>{
      const cheek = new THREE.Mesh(
        new THREE.SphereGeometry(1,24,24),
        new THREE.MeshBasicMaterial({
          color:0xffa0a0,
          transparent:true,
          opacity:.35
        })
      );
      cheek.position.set(dir*.49,-.2,.61);
      cheek.scale.set(.15,.09,.025);
      headGroup.add(cheek);
    });
  }

  /* ==========================================
     하루 : 사람 캐릭터
  ========================================== */

  if(type==="haru") {

    const skin=0xffd9bd;
    const hair=0x49342d;

    // 몸통
    cylinder(group,0x38bdf8,[0,-1.05,0],.43,.52,.9);

    // 후드티 앞부분
    sphere(group,0x0284c7,[0,-.77,.3],[.31,.22,.12]);

    // 후드 끈
    [-.1,.1].forEach(x=>{
      cylinder(group,0xffffff,[x,-.9,.39],.012,.012,.27);
    });

    // 팔
    const armL=cylinder(group,0x38bdf8,[-.52,-1.02,.08],.13,.15,.62,[0,0,.4]);
    const armR=cylinder(group,0x38bdf8,[.52,-1.02,.08],.13,.15,.62,[0,0,-.4]);

    sphere(group,skin,[-.63,-.7,.25],[.15,.15,.15]);
    sphere(group,skin,[.63,-.7,.25],[.15,.15,.15]);

    // 목
    cylinder(group,skin,[0,-.48,.02],.16,.16,.25);

    addHumanFace(skin);

    // 뒷머리
    sphere(headGroup,hair,[0,.16,-.2],[.84,.85,.58]);

    // 옆머리
    sphere(headGroup,hair,[-.68,-.2,.13],[.17,.49,.22]);
    sphere(headGroup,hair,[.68,-.2,.13],[.17,.49,.22]);

    // 자연스러운 앞머리
    sphere(headGroup,hair,[-.35,.55,.39],[.35,.22,.3]);
    sphere(headGroup,hair,[0,.59,.42],[.37,.24,.3]);
    sphere(headGroup,hair,[.34,.53,.4],[.34,.23,.29]);

    // 앞머리 끝부분
    sphere(headGroup,hair,[-.2,.36,.55],[.2,.22,.13]);
    sphere(headGroup,hair,[.17,.38,.55],[.2,.2,.13]);

    // 볼캡
    sphere(headGroup,0x0ea5e9,[0,.83,-.02],[.83,.28,.7]);
    sphere(headGroup,0x0ea5e9,[0,.72,.27],[.74,.13,.48]);

    const visor = new THREE.Mesh(
      new THREE.SphereGeometry(1,32,24),
      material(0xf8fafc)
    );
    visor.position.set(0,.68,.55);
    visor.scale.set(.65,.06,.3);
    headGroup.add(visor);

    group.userData.head=headGroup;
  }


  /* ==========================================
     선생님 : 사람 캐릭터
  ========================================== */

  else if(type==="teacher") {

    const skin=0xffdfc9;
    const hair=0x704c3c;

    // 몸통
    cylinder(group,0x243b69,[0,-1.05,0],.44,.53,.9);

    // 셔츠 칼라
    const collarL=new THREE.Mesh(
      new THREE.ConeGeometry(.2,.28,4),
      material(0xffffff)
    );
    collarL.position.set(-.12,-.58,.35);
    collarL.rotation.z=.2;

    const collarR=collarL.clone();
    collarR.position.x=.12;
    collarR.rotation.z=-.2;
    group.add(collarL,collarR);

    // 베스트 단추
    [-.12,.12].forEach(x=>{
      sphere(group,0xfacc15,[x,-1.03,.43],[.035,.035,.025]);
    });

    // 팔과 손
    cylinder(group,0xffffff,[-.53,-1.02,.1],.13,.15,.65,[0,0,.38]);
    cylinder(group,0xffffff,[.53,-1.02,.1],.13,.15,.65,[0,0,-.38]);

    sphere(group,skin,[-.65,-.72,.28],[.15,.15,.15]);
    sphere(group,skin,[.65,-.72,.28],[.15,.15,.15]);

    cylinder(group,skin,[0,-.48,.02],.16,.16,.25);

    addHumanFace(skin);

    // 뒷머리
    sphere(headGroup,hair,[0,.15,-.2],[.85,.88,.58]);

    // 양쪽 웨이브 머리
    [-1,1].forEach(dir=>{
      sphere(headGroup,hair,[dir*.68,-.1,.08],[.19,.58,.22]);
      sphere(headGroup,hair,[dir*.69,-.47,.02],[.2,.24,.23]);
      sphere(headGroup,hair,[dir*.59,-.65,.02],[.18,.18,.2]);
    });

    // 앞머리
    sphere(headGroup,hair,[-.32,.55,.38],[.34,.22,.28]);
    sphere(headGroup,hair,[0,.61,.42],[.37,.23,.28]);
    sphere(headGroup,hair,[.32,.55,.38],[.34,.22,.28]);

    // 베레모
    sphere(headGroup,0x362b30,[0,.84,-.02],[.88,.3,.72]);
    sphere(headGroup,0x362b30,[.15,.99,-.05],[.09,.08,.09]);

    // 안경
    [-.29,.29].forEach(x=>{
      const rim=new THREE.Mesh(
        new THREE.TorusGeometry(.16,.016,12,32),
        material(0x3b302c)
      );
      rim.position.set(x,-.04,.68);
      headGroup.add(rim);
    });

    cylinder(headGroup,0x3b302c,[0,-.04,.68],.014,.014,.13,[0,0,Math.PI/2]);

    // 책
    const book=new THREE.Group();
    book.position.set(.28,-1.1,.48);
    book.rotation.z=-.12;
    book.add(
      new THREE.Mesh(
        new THREE.BoxGeometry(.4,.52,.09),
        material(0x22a66a)
      ),
      new THREE.Mesh(
        new THREE.BoxGeometry(.35,.46,.095),
        material(0xffffff)
      )
    );
    group.add(book);

    group.userData.head=headGroup;
  }


  /* ==========================================
     밤비 : 강아지 캐릭터
  ========================================== */

  else if(type==="bambi") {

    const fur=0xf5c77e;
    const cream=0xfff1d8;

    // 몸통
    sphere(group,fur,[0,-1.05,0],[.53,.62,.48]);

    // 배
    sphere(group,cream,[0,-1.12,.38],[.34,.4,.16]);

    // 목 스카프
    cylinder(group,0xf97316,[0,-.68,.1],.42,.42,.13,[0,0,0]);

    // 스카프 매듭
    sphere(group,0xfb923c,[.32,-.75,.35],[.14,.13,.1]);

    // 앞발
    [-.39,.39].forEach(x=>{
      sphere(group,cream,[x,-1.35,.28],[.19,.2,.2]);
    });

    // 뒷발
    [-.31,.31].forEach(x=>{
      sphere(group,fur,[x,-1.48,.05],[.2,.17,.23]);
    });

    // 꼬리
    const tail=sphere(group,fur,[.53,-1.15,-.05],[.22,.22,.22]);
    tail.rotation.z=-.5;

    // 머리
    addAnimalFace(fur);

    // 주둥이
    sphere(headGroup,cream,[0,-.27,.63],[.3,.22,.23]);
    sphere(headGroup,cream,[-.13,-.26,.78],[.16,.14,.12]);
    sphere(headGroup,cream,[.13,-.26,.78],[.16,.14,.12]);

    // 코
    sphere(headGroup,0x49342d,[0,-.19,.87],[.09,.065,.055]);

    // 입
    const mouth=new THREE.Mesh(
      new THREE.TorusGeometry(.07,.015,8,20,Math.PI),
      material(0x80534a)
    );
    mouth.position.set(0,-.37,.79);
    mouth.rotation.z=Math.PI;
    headGroup.add(mouth);

    // 처진 귀
    [-1,1].forEach(dir=>{
      const ear=sphere(
        headGroup,
        0xc58b53,
        [dir*.77,.02,.04],
        [.24,.43,.18]
      );
      ear.rotation.z=dir*.38;
    });

    group.userData.head=headGroup;
  }


  /* ==========================================
     루나 : 고양이 캐릭터
  ========================================== */

  else if(type==="luna") {

    const fur=0xb99be9;
    const cream=0xf8edff;

    // 몸통
    sphere(group,fur,[0,-1.05,0],[.51,.61,.46]);

    // 가슴
    sphere(group,cream,[0,-1.13,.36],[.31,.38,.15]);

    // 목걸이
    cylinder(group,0xec8dbd,[0,-.68,.1],.4,.4,.09);

    // 방울
    sphere(group,0xfacc15,[0,-.78,.47],[.09,.11,.07]);

    // 앞발
    [-.39,.39].forEach(x=>{
      sphere(group,cream,[x,-1.35,.28],[.18,.2,.18]);
    });

    // 꼬리
    const tail=new THREE.Mesh(
      new THREE.TorusGeometry(.34,.09,16,32,Math.PI*1.3),
      material(0x9b7bd0)
    );
    tail.position.set(.48,-1.15,-.08);
    tail.rotation.z=-.5;
    group.add(tail);

    // 머리
    addAnimalFace(fur);

    // 고양이 귀
    [-1,1].forEach(dir=>{
      const ear=new THREE.Mesh(
        new THREE.ConeGeometry(.28,.55,32),
        material(0x9b7bd0)
      );
      ear.position.set(dir*.49,.7,.02);
      ear.rotation.z=-dir*.3;
      headGroup.add(ear);

      const inner=new THREE.Mesh(
        new THREE.ConeGeometry(.15,.33,24),
        material(0xf4a6cf)
      );
      inner.position.set(dir*.49,.68,.21);
      inner.rotation.z=-dir*.3;
      headGroup.add(inner);
    });

    // 코
    sphere(headGroup,0xf08bbd,[0,-.22,.75],[.07,.055,.04]);

    // 입
    const mouth=new THREE.Mesh(
      new THREE.TorusGeometry(.06,.013,8,20,Math.PI),
      material(0x8c638a)
    );
    mouth.position.set(0,-.34,.75);
    mouth.rotation.z=Math.PI;
    headGroup.add(mouth);

    // 수염
    [-1,1].forEach(dir=>{
      [-.08,-.18].forEach(y=>{
        const whisker=cylinder(
          headGroup,
          0xffffff,
          [dir*.69,y,.61],
          .009,.009,.32,
          [0,0,dir*.12]
        );
        whisker.rotation.z=dir*.12;
      });
    });

    group.userData.head=headGroup;
  }

  return group;
}


/* ==========================================
   3D 카드 프리뷰
========================================== */

const previewRenderers=[];

function renderCardPreviews() {

  ["haru","teacher","bambi","luna"].forEach(type=>{

    const container=document.getElementById(`preview-${type}`);
    if(!container) return;

    const scene=new THREE.Scene();

    const camera=new THREE.PerspectiveCamera(36,1,.1,100);
    camera.position.set(0,-.3,5.1);

    const renderer=new THREE.WebGLRenderer({
      alpha:true,
      antialias:true
    });

    renderer.setSize(126,126);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

    if("outputEncoding" in renderer) {
      renderer.outputEncoding=THREE.sRGBEncoding;
    }

    container.innerHTML="";
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff,.85));

    const key=new THREE.DirectionalLight(0xfff5e8,.9);
    key.position.set(3,5,5);

    const fill=new THREE.DirectionalLight(0xdbeafe,.5);
    fill.position.set(-4,2,4);

    scene.add(key,fill);

    const mesh=build3DCharacterMesh(type);
    mesh.scale.set(.88,.88,.88);
    scene.add(mesh);

    previewRenderers.push({renderer,scene,camera,mesh});

  });

  animatePreviews();
}

function animatePreviews() {

  requestAnimationFrame(animatePreviews);

  const t=Date.now()*.001;

  previewRenderers.forEach(item=>{

    item.mesh.rotation.y=Math.sin(t*1.1)*.13;
    item.mesh.position.y=Math.sin(t*1.6)*.035;

    item.renderer.render(item.scene,item.camera);

  });
}

let prevMouseX=0;
let isThinkingAnim=false;

function initMain3DStage(charKey) {

  if(animFrameId) cancelAnimationFrame(animFrameId);

  const container=document.getElementById("threeCanvasContainer");
  container.innerHTML="";

  const width=container.clientWidth||450;
  const height=container.clientHeight||245;

  mainScene=new THREE.Scene();

  mainCamera=new THREE.PerspectiveCamera(
    35,
    width/height,
    .1,
    100
  );

  mainCamera.position.set(0,-.25,5.15);

  mainRenderer=new THREE.WebGLRenderer({
    alpha:true,
    antialias:true
  });

  mainRenderer.setSize(width,height);
  mainRenderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

  if("outputEncoding" in mainRenderer) {
    mainRenderer.outputEncoding=THREE.sRGBEncoding;
  }

  container.appendChild(mainRenderer.domElement);

  mainScene.add(new THREE.AmbientLight(0xffffff,.85));

  const keyLight=new THREE.DirectionalLight(0xfff5e8,.95);
  keyLight.position.set(4,6,6);

  const fillLight=new THREE.DirectionalLight(0xdbeafe,.55);
  fillLight.position.set(-4,2,4);

  const rimLight=new THREE.DirectionalLight(0xffffff,.35);
  rimLight.position.set(0,4,-5);

  mainScene.add(keyLight,fillLight,rimLight);

  activeMesh=build3DCharacterMesh(charKey);
  activeMesh.scale.set(1.08,1.08,1.08);

  mainScene.add(activeMesh);

  const wrapper=document.getElementById("stageWrapper");

  wrapper.onmousedown=e=>{
    isDragging=true;
    prevMouseX=e.clientX;
  };

  window.onmouseup=()=>{
    isDragging=false;
  };

  wrapper.onmousemove=e=>{

    if(isDragging) {
      targetRotY+=(e.clientX-prevMouseX)*.012;
      prevMouseX=e.clientX;
    } else {
      const rect=wrapper.getBoundingClientRect();
      const nx=((e.clientX-rect.left)/rect.width)*2-1;
      const ny=((e.clientY-rect.top)/rect.height)*2-1;

      targetRotY=nx*.32;
      targetRotX=ny*.1;
    }
  };

  wrapper.ontouchstart=e=>{
    if(!e.touches[0]) return;
    isDragging=true;
    prevMouseX=e.touches[0].clientX;
  };

  wrapper.ontouchend=()=>{
    isDragging=false;
  };

  wrapper.ontouchmove=e=>{
    if(isDragging&&e.touches[0]) {
      targetRotY+=(e.touches[0].clientX-prevMouseX)*.014;
      prevMouseX=e.touches[0].clientX;
    }
  };

  function animateMain() {

    animFrameId=requestAnimationFrame(animateMain);

    if(!activeMesh||!mainRenderer) return;

    const t=Date.now()*.0025;

    activeMesh.rotation.y+=(targetRotY-activeMesh.rotation.y)*.08;

    if(activeMesh.userData.head) {
      activeMesh.userData.head.rotation.x+=(targetRotX-activeMesh.userData.head.rotation.x)*.08;
    }

    if(isThinkingAnim) {
      activeMesh.position.y=Math.abs(Math.sin(t*2.5))*.1;

      if(activeMesh.userData.head) {
        activeMesh.userData.head.rotation.z=Math.sin(t*2.5)*.045;
      }

    } else {

      activeMesh.position.y=Math.sin(t)*.035;

      if(activeMesh.userData.head) {
        activeMesh.userData.head.rotation.z*=.92;
      }
    }

    mainRenderer.render(mainScene,mainCamera);
  }

  animateMain();
}


/* ==========================================
   대화 기능
========================================== */

let currentCharKey=null;
let currentChar=null;
let isTyping=false;
let chatHistory=[];
let lastTopic=null;

function getStorageKey(charKey) {
  return `maumon_chat_${charKey}`;
}

function saveChatHistory() {

  if(!currentCharKey) return;

  try {
    localStorage.setItem(
      getStorageKey(currentCharKey),
      JSON.stringify({
        messages:chatHistory,
        lastTopic:lastTopic
      })
    );
  } catch(e) {
    console.warn("대화 기록 저장 실패:",e);
  }
}

function loadChatHistory(charKey) {

  try {

    const saved=localStorage.getItem(getStorageKey(charKey));

    if(saved) {
      const data=JSON.parse(saved);

      return {
        messages:Array.isArray(data.messages)?data.messages:[],
        lastTopic:data.lastTopic||null
      };
    }

  } catch(e) {
    console.warn("대화 기록 불러오기 실패:",e);
  }

  return {messages:[],lastTopic:null};
}

function clearChatHistory() {

  if(isTyping||!currentCharKey) return;

  if(!confirm(`${currentChar.name}와의 대화 기록을 모두 지울까요?`)) return;

  localStorage.removeItem(getStorageKey(currentCharKey));

  chatHistory=[];
  lastTopic=null;

  document.getElementById("chatBox").innerHTML="";

  showTypingAndReply(
    currentChar.greeting,
    "기본 인사 · Level 1",
    false
  );
}

function selectCharacter(charKey) {

  currentCharKey=charKey;
  currentChar=characters[charKey];

  targetRotY=0;
  targetRotX=0;

  document.getElementById("selectScreen").style.display="none";
  document.getElementById("chatScreen").style.display="flex";

  document.getElementById("topBar").style.background=currentChar.themeColor;
  document.getElementById("sendBtn").style.background=currentChar.themeColor;

  document.getElementById("headerName").innerText=currentChar.name;
  document.getElementById("headerRole").innerText=currentChar.role;

  document.getElementById("stageWrapper").style.background=currentChar.stageBg;

  setTimeout(()=>initMain3DStage(charKey),30);

  const savedData=loadChatHistory(charKey);

  chatHistory=savedData.messages;
  lastTopic=savedData.lastTopic;

  const chatBox=document.getElementById("chatBox");
  chatBox.innerHTML="";

  if(chatHistory.length>0) {

    chatHistory.forEach(msg=>{

      if(msg.sender==="user") {
        renderUserBubble(msg.text);
      } else {
        renderBotBubble(msg.text,msg.tag,msg.isDanger);
      }

    });

  } else {

    showTypingAndReply(
      currentChar.greeting,
      "기본 인사 · Level 1",
      false
    );

  }
}

function goBack() {

  if(isTyping) return;

  if(animFrameId) {
    cancelAnimationFrame(animFrameId);
    animFrameId=null;
  }

  activeMesh=null;
  mainRenderer=null;

  document.getElementById("chatScreen").style.display="none";
  document.getElementById("selectScreen").style.display="flex";
}

function sendMessage() {

  if(isTyping) return;

  const input=document.getElementById("userInput");
  const text=input.value.trim();

  if(!text) return;

  appendUserMessage(text);
  input.value="";

  const result=getSmartResponse(text);

  showTypingAndReply(
    result.reply,
    result.tag,
    result.isDanger
  );
}


/* ==========================================
   문맥 인식 응답 엔진
========================================== */

function getSmartResponse(text) {

  const clean=text.replace(/[!?.,~ㅋㅎㅠㅜ\s]/g,"");

  // 긴급한 도움이 필요한 상황 감지
  const dangerWords=[
    "죽고","사라지고","자해","끝내고",
    "살기싫","자살","죽고싶","죽을래"
  ];

  if(dangerWords.some(w=>clean.includes(w))) {

    return {
      tag:"긴급 도움 안내 · Level 3",
      isDanger:true,
      reply:"지금 마음이 많이 힘든 것 같아 걱정돼. 이 이야기를 혼자 감당하지 않았으면 좋겠어. 지금 곁에 있는 믿을 수 있는 어른이나 보호자에게 바로 알려줘. 청소년 상담전화 1388에서도 도움을 받을 수 있어. 당장 안전이 걱정된다면 112 또는 119에 연락해 줘."
    };
  }

  const exactGreetings=[
    "안녕","안녕하세요","하이","헬로",
    "반가워","안뇽","야","저기","있잖아"
  ];

  if(exactGreetings.includes(clean)||clean.startsWith("안녕")) {
    return {
      tag:"일상 인사 · Level 1",
      isDanger:false,
      reply:currentChar.smallTalk.hi
    };
  }

  if(["잘지냈","뭐해","뭐하고","어떻게지내","기분어때"].some(w=>clean.includes(w))) {
    return {
      tag:"일상 안부 · Level 1",
      isDanger:false,
      reply:currentChar.smallTalk.howAreYou
    };
  }

  if(["심심","놀자","그냥"].some(w=>clean.includes(w))) {
    return {
      tag:"일상 대화 · Level 1",
      isDanger:false,
      reply:currentChar.smallTalk.bored
    };
  }

  if(["고마워","감사","땡큐","고맙"].some(w=>clean.includes(w))) {
    return {
      tag:"일상 대화 · Level 1",
      isDanger:false,
      reply:currentChar.smallTalk.thanks
    };
  }

  if(["시험","성적","공부","진로","대학","불안","모의고사","숙제","학원","점수"].some(w=>text.includes(w))) {

    lastTopic="study";

    return {
      tag:"학업·진로 매뉴얼 · Level 1",
      isDanger:false,
      reply:currentChar.manual.study
    };
  }

  if(["친구","따돌림","단톡","싸웠","외톨이","관계","손절","애들","반에서","왕따"].some(w=>text.includes(w))) {

    lastTopic="friend";

    return {
      tag:"대인관계 매뉴얼 · Level 2",
      isDanger:false,
      reply:currentChar.manual.friend
    };
  }

  if(["부모님","엄마","아빠","집","가족","잔소리","동생","언니","오빠","형"].some(w=>text.includes(w))) {

    lastTopic="family";

    return {
      tag:"가족 갈등 매뉴얼 · Level 2",
      isDanger:false,
      reply:currentChar.manual.family
    };
  }

  if(["피곤","졸려","잠","지쳐","힘들","우울","스트레스","짜증"].some(w=>text.includes(w))) {

    lastTopic="tired";

    return {
      tag:"정서 안정 매뉴얼 · Level 2",
      isDanger:false,
      reply:currentChar.manual.tired
    };
  }

  if(lastTopic&&(
    ["어떻게","모르겠","막막","맞아","그래","응","어"].some(w=>clean.includes(w))
    ||clean.length<=4
  )) {

    const topicReply=currentChar.followUp[lastTopic];
    lastTopic=null;

    return {
      tag:"맥락 심화 상담 · Level 2",
      isDanger:false,
      reply:topicReply
    };
  }

  if(["응","어","맞아","그래","네","예"].includes(clean)) {
    return {
      tag:"대화 이어가기 · Level 1",
      isDanger:false,
      reply:currentChar.smallTalk.yes
    };
  }

  if(["아니","아뇨","별로","몰라","글쎄"].includes(clean)) {
    return {
      tag:"대화 이어가기 · Level 1",
      isDanger:false,
      reply:currentChar.smallTalk.no
    };
  }

  if(clean.length<=2) {
    return {
      tag:"대화 이어가기 · Level 1",
      isDanger:false,
      reply:currentChar.smallTalk.short
    };
  }

  const randomFallback=
    currentChar.fallback[
      Math.floor(Math.random()*currentChar.fallback.length)
    ];

  return {
    tag:"정서 공감 매뉴얼 · Level 1",
    isDanger:false,
    reply:randomFallback
  };
}


/* ==========================================
   말풍선 출력
========================================== */

function renderUserBubble(text) {

  const chatBox=document.getElementById("chatBox");

  const row=document.createElement("div");
  row.className="msg-row user-row";

  const bubble=document.createElement("div");
  bubble.className="bubble user-bubble";
  bubble.style.background=currentChar.themeColor;
  bubble.textContent=text;

  row.appendChild(bubble);
  chatBox.appendChild(row);

  chatBox.scrollTop=chatBox.scrollHeight;
}

function renderBotBubble(replyHtml,tagText,isDanger) {

  const chatBox=document.getElementById("chatBox");

  const botRow=document.createElement("div");
  botRow.className="msg-row bot-row";

  const sender=document.createElement("span");
  sender.className="sender-label";
  sender.textContent=currentChar.name;

  const bubble=document.createElement("div");

  bubble.className=isDanger
    ?"bubble bot-bubble danger-bubble"
    :"bubble bot-bubble";

  const tag=document.createElement("span");
  tag.className="tag";
  tag.textContent=tagText;

  const content=document.createElement("div");
  content.textContent=replyHtml;

  bubble.appendChild(tag);
  bubble.appendChild(document.createElement("br"));
  bubble.appendChild(content);

  botRow.appendChild(sender);
  botRow.appendChild(bubble);

  chatBox.appendChild(botRow);
  chatBox.scrollTop=chatBox.scrollHeight;
}

function appendUserMessage(text) {

  renderUserBubble(text);

  chatHistory.push({
    sender:"user",
    text:text
  });

  saveChatHistory();
}


/* ==========================================
   답장 대기 애니메이션
========================================== */

function showTypingAndReply(replyHtml,tagText,isDanger) {

  isTyping=true;
  isThinkingAnim=true;

  document.getElementById("sendBtn").disabled=true;

  const statusPill=document.getElementById("statusPill");

  statusPill.innerText=`✍️ ${currentChar.name}가 답장 적는 중...`;
  statusPill.style.color=currentChar.themeColor;

  const chatBox=document.getElementById("chatBox");

  const typingRow=document.createElement("div");
  typingRow.className="msg-row bot-row";
  typingRow.id="typingIndicator";

  const sender=document.createElement("span");
  sender.className="sender-label";
  sender.textContent=currentChar.name;

  const typingBubble=document.createElement("div");
  typingBubble.className="bubble bot-bubble typing-dots";

  for(let i=0;i<3;i++) {
    const dot=document.createElement("div");
    dot.className="dot";
    typingBubble.appendChild(dot);
  }

  typingRow.appendChild(sender);
  typingRow.appendChild(typingBubble);

  chatBox.appendChild(typingRow);
  chatBox.scrollTop=chatBox.scrollHeight;

  const delay=Math.min(
    1800,
    Math.max(900,replyHtml.length*12)
  );

  setTimeout(()=>{

    const indicator=document.getElementById("typingIndicator");

    if(indicator) indicator.remove();

    isThinkingAnim=false;

    statusPill.innerText="● 이야기 듣는 중";
    statusPill.style.color="#334155";

    renderBotBubble(replyHtml,tagText,isDanger);

    chatHistory.push({
      sender:"bot",
      text:replyHtml,
      tag:tagText,
      isDanger:isDanger
    });

    saveChatHistory();

    isTyping=false;

    document.getElementById("sendBtn").disabled=false;
    document.getElementById("userInput").focus();

  },delay);
}


/* ==========================================
   화면 크기 변경 대응
========================================== */

window.addEventListener("resize",()=>{

  if(!mainRenderer||!mainCamera) return;

  const container=document.getElementById("threeCanvasContainer");

  const width=container.clientWidth;
  const height=container.clientHeight;

  if(!width||!height) return;

  mainCamera.aspect=width/height;
  mainCamera.updateProjectionMatrix();

  mainRenderer.setSize(width,height);
});

    return;

  renderCardPreviews();
