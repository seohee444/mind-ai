<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마음온(On) - AI 심리 상담소</title>
  <style>
    * { box-sizing: border-box; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    body {
      background: radial-gradient(circle at top left, #eef2ff, #fdf4ff, #fff7ed);
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; margin: 0; padding: 12px;
    }
    .app-container {
      width: 100%; max-width: 450px; height: 88vh; max-height: 780px;
      background: #ffffff; border-radius: 30px;
      box-shadow: 0 18px 45px rgba(30, 41, 59, 0.12);
      overflow: hidden; display: flex; flex-direction: column; position: relative;
      border: 1px solid #f1f5f9;
    }

    /* 1. 캐릭터 선택 화면 */
    .select-screen {
      flex: 1; padding: 24px 18px; display: flex; flex-direction: column;
      overflow-y: auto; background: linear-gradient(180deg, #fafbff 0%, #ffffff 100%);
    }
    .select-header { text-align: center; margin-bottom: 18px; }
    .select-header h2 { margin: 0 0 6px; font-size: 21px; color: #1e293b; letter-spacing: -0.5px; }
    .select-header p { margin: 0; font-size: 13px; color: #64748b; line-height: 1.45; }

    .char-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex: 1; }
    .char-card {
      background: #ffffff; border: 2px solid #f1f5f9; border-radius: 22px;
      padding: 12px 10px 14px; cursor: pointer; transition: 0.25s all ease;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.03);
    }
    .char-card:hover {
      transform: translateY(-4px); border-color: #818cf8;
      box-shadow: 0 12px 24px rgba(99, 102, 241, 0.15);
    }
    .card-avatar-box {
      width: 124px; height: 124px; border-radius: 22px;
      margin-bottom: 10px; overflow: hidden;
      display: flex; justify-content: center; align-items: flex-end;
    }
    .card-avatar-box svg {
      width: 118px; height: 118px;
      animation: floatIdle 3.2s ease-in-out infinite;
    }
    .card-badge {
      font-size: 10.5px; font-weight: bold; padding: 3px 9px;
      border-radius: 12px; margin-bottom: 5px;
    }
    .char-card h3 { margin: 0 0 4px; font-size: 16px; color: #0f172a; }
    .char-card p { margin: 0; font-size: 11.5px; color: #64748b; line-height: 1.35; word-break: keep-all; }

    /* 2. 채팅 화면 */
    .chat-screen { display: none; flex-direction: column; height: 100%; }

    .top-bar {
      padding: 13px 16px; color: white; display: flex;
      align-items: center; justify-content: space-between; z-index: 5;
    }
    .top-bar-title { display: flex; align-items: center; gap: 6px; }
    .top-bar-title h3 { margin: 0; font-size: 16px; }
    .top-bar-title span {
      font-size: 10.5px; background: rgba(255,255,255,0.22);
      padding: 2px 8px; border-radius: 10px;
    }
    .top-bar-actions { display: flex; gap: 6px; }
    .change-btn {
      background: rgba(255,255,255,0.25); border: none; color: white;
      font-size: 11.5px; padding: 6px 10px; border-radius: 14px;
      cursor: pointer; font-weight: bold; transition: 0.2s;
    }
    .change-btn:hover { background: rgba(255,255,255,0.4); }

    /* 캐릭터 스테이지 */
    .stage-wrapper {
      height: 220px; width: 100%; position: relative;
      border-bottom: 1px solid #f1f5f9; overflow: hidden;
      display: flex; justify-content: center; align-items: flex-end;
      perspective: 700px;
    }
    .character-actor {
      width: 200px; height: 200px;
      transition: transform 0.15s ease-out;
      transform-style: preserve-3d;
      animation: floatIdle 3.2s ease-in-out infinite;
    }
    .character-actor.thinking {
      animation: bounceTalk 0.6s ease-in-out infinite;
    }
    .character-actor svg {
      width: 100%; height: 100%;
      filter: drop-shadow(0 12px 18px rgba(30, 41, 59, 0.14));
    }
    .stage-hint {
      position: absolute; top: 10px; left: 14px;
      font-size: 10.5px; color: rgba(30, 41, 59, 0.65);
      background: rgba(255,255,255,0.82); padding: 3px 9px; border-radius: 10px;
      pointer-events: none;
    }
    .status-pill {
      position: absolute; bottom: 10px; right: 14px;
      background: rgba(255,255,255,0.95); color: #334155;
      font-size: 11px; padding: 4px 11px; border-radius: 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08); font-weight: bold;
      pointer-events: none;
    }

    @keyframes floatIdle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes bounceTalk {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-8px) rotate(-2deg); }
      75% { transform: translateY(-8px) rotate(2deg); }
    }

    /* 대화창 */
    .chat-box {
      flex: 1; padding: 16px 14px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 12px; background: #f8fafc;
    }
    .msg-row { display: flex; flex-direction: column; max-width: 82%; }
    .msg-row.bot-row { align-self: flex-start; }
    .msg-row.user-row { align-self: flex-end; align-items: flex-end; }
    .sender-label { font-size: 11px; color: #64748b; margin: 0 0 4px 6px; font-weight: bold; }
    .bubble {
      padding: 11px 15px; border-radius: 18px; font-size: 13.8px;
      line-height: 1.55; word-break: keep-all; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .bot-bubble { background: #ffffff; color: #1e293b; border-top-left-radius: 4px; border: 1px solid #e2e8f0; }
    .user-bubble { color: #ffffff; border-top-right-radius: 4px; }
    .tag {
      display: inline-block; font-size: 10px; font-weight: bold;
      padding: 2px 7px; border-radius: 6px; margin-bottom: 5px;
      background: #f1f5f9; color: #475569;
    }

    .danger-bubble { background: #fff5f5; border: 1.5px solid #ff6b6b; color: #c92a2a; }
    .danger-bubble .tag { background: #ff6b6b; color: white; }

    .typing-dots { display: flex; gap: 5px; padding: 13px 16px; align-items: center; }
    .dot { width: 7px; height: 7px; background: #94a3b8; border-radius: 50%; animation: bounce 1.3s infinite ease-in-out; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; } 40% { transform: scale(1.15); opacity: 1; } }

    .input-area {
      display: flex; padding: 11px 12px; background: #ffffff;
      border-top: 1px solid #e2e8f0; gap: 8px;
    }
    input {
      flex: 1; border: 1.5px solid #cbd5e1; border-radius: 22px;
      padding: 10px 16px; font-size: 14px; outline: none; transition: 0.2s;
    }
    input:focus { border-color: #6366f1; }
    .send-btn {
      border: none; border-radius: 22px; padding: 0 18px;
      color: white; font-weight: bold; font-size: 14px; cursor: pointer;
    }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>

      <div class="char-grid">

          <span class="card-badge" style="background:#bae6fd; color:#0369a1;">동갑내기 단짝 친구</span>

          <p>"무조건 네 편이야! 편하게 반말로 다 털어놔."</p>
        </div>

        <div class="char-card" onclick="selectCharacter('teacher')">

          <span class="card-badge" style="background:#bbf7d0; color:#15803d;">다정한 상담 선생님</span>
          <h3>선생님</h3>
          <p>"혼자 고민하지 마세요. 선생님이 차분히 들어줄게요."</p>
        </div>

        <div class="char-card" onclick="selectCharacter('bambi')">
          <div class="card-avatar-box" style="background:radial-gradient(circle at 50% 30%, #fff7ed, #fed7aa);" id="preview-bambi"></div>
          <span class="card-badge" style="background:#fed7aa; color:#c2410c;">말랑한 아기 강아지</span>
          <h3>밤비</h3>
          <p>"꼬리 흔들며 기다렸어! 오늘 무슨 일 있었어?"</p>
        </div>

        <div class="char-card" onclick="selectCharacter('luna')">
          <div class="card-avatar-box" style="background:radial-gradient(circle at 50% 30%, #faf5ff, #e9d5ff);" id="preview-luna"></div>
          <span class="card-badge" style="background:#e9d5ff; color:#7e22ce;">차분한 달빛 고양이</span>
          <h3>루나</h3>
          <p>"복잡한 머릿속을 차분하게 정리해 줄게냥."</p>
        </div>
      </div>
    </div>

    <!-- 2. 채팅 화면 -->
    <div class="chat-screen" id="chatScreen">
      <div class="top-bar" id="topBar">
        <div class="top-bar-title">
          <h3 id="headerName">하루</h3>
          <span id="headerRole">동갑내기 단짝</span>
        </div>
        <div class="top-bar-actions">
          <button class="change-btn" onclick="clearChatHistory()">대화 초기화</button>
          <button class="change-btn" onclick="goBack()">캐릭터 바꾸기</button>
        </div>
      </div>

      <div class="stage-wrapper" id="stageWrapper">
        <div class="stage-hint">✨ 마우스를 움직이면 시선이 따라가요</div>
        <div class="character-actor" id="characterActor"></div>
        <div class="status-pill" id="statusPill">● 이야기 듣는 중</div>
      </div>

      <div class="chat-box" id="chatBox"></div>

      <div class="input-area">
        <input type="text" id="userInput" placeholder="인사나 고민을 편하게 적어봐..." onkeypress="if(event.key==='Enter') sendMessage()" />
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">전송</button>
      </div>
    </div>
  </div>

          family: "가족이랑 부딪히면 집에서도 편히 쉬지 못해 정말 답답하지... 오늘은 맛있는 간식도 먹고 좋아하는 거 보면서 네 마음부터 따뜻하게 안아주자. 내일은 분명 오늘보다 마음이 한결 편해질 거야!",
          tired: "에고, 에너지가 바닥났구나! 밤비 옆에 폭신하게 기대서 잠깐 눈 좀 붙여! 무리하지 말고 오늘은 푹 쉬어야 해!"
        }
      },
      luna: {
        name: "루나",
        role: "차분한 달빛 고양이",
        themeColor: "#9333ea",
        stageBg: "radial-gradient(circle at 50% 35%, #faf5ff 0%, #e9d5ff 100%)",
        greeting: "안녕, 난 루나야. 가벼운 인사도 좋고, 머릿속이 복잡해서 정리가 필요할 때도 언제든 찾아와냥.",
        smallTalk: {
          hi: "안녕! 반가워냥. 오늘 하루는 좀 평온했어? 무슨 생각 중이었는지 궁금하네.",
          howAreYou: "난 창가에서 달빛 쬐며 잘 지냈어냥. 넌 오늘 마음의 날씨가 어때?",
          bored: "심심할 땐 창밖 보면서 멍때리는 것도 좋지. 요즘 네 머릿속을 제일 많이 차지하는 건 뭐야?",
          thanks: "고맙긴, 당연한 건데 뭘. 기분 나아졌다니 나도 뿌듯하다냥.",
          yes: "응, 잘 듣고 있어냥. 이어서 네 생각을 차분히 정리해 볼까?",
          no: "그래냥, 억지로 말할 필요는 없어. 그냥 조용히 함께 있어도 충분하니까.",
          short: "응, 차분히 듣고 있어. 급할 거 없으니 천천히 이야기해 줘."
        },
        followUp: {
          study: "불안은 미래를 미리 걱정할 때 커지곤 해. 지금 눈앞에 있는 작은 할 일 하나에만 집중해 보자냥.",
          friend: "타인의 마음은 내가 조종할 수 없는 영역이야. 네 진심을 다했다면 그걸로 충분해냥.",
          family: "서로 너무 가까워서 생기는 마찰일 뿐이야. 잠시 거리를 두고 나만의 시간을 확보해 봐.",
          tired: "아무것도 하지 않는 시간도 꼭 필요한 일정이야. 오늘은 스스로에게 휴식을 허락해 줘냥."
        },
        fallback: [
          "음, 그런 상황이 있었구나. 좀 더 구체적으로 들려줄 수 있을까?",
          "솔직하게 말해줘서 고마워. 그 일 때문에 요즘 어떤 생각이 제일 많이 들어?"
        ],
        manual: {
          study: "성적이나 진로 고민은 끝이 없어 보여서 더 불안해지기 쉬워. 막연한 걱정을 계속 떠올리기보다, 오늘 내가 통제할 수 있는 분량만 딱 정해서 끝내는 게 불안감을 줄이는 가장 확실한 방법이야.",
          friend: "대인관계 갈등은 내 잘못이 아닌데도 자꾸 내 탓을 하게 만들곤 해. 감정이 격해졌을 땐 잠시 거리를 두고 내 마음을 먼저 보호하는 게 현명해. 조금 차분해진 뒤에 상황을 다시 바라보자.",
          family: "가족 간의 대화는 서로 너무 익숙해서 오히려 배려를 놓치기 쉬워. 당장 상대방을 설득하려 애쓰기보다, 내가 진짜 원하는 게 무엇인지 차분히 정리하는 시간부터 가져보는 걸 추천할게.",
          tired: "피로가 쌓이면 평소엔 아무렇지 않던 일도 버겁게 느껴져. 오늘은 생각을 잠시 멈추고 따뜻한 물 마시면서 일찍 쉬는 게 최고야."
        }
      }
    };

    // ================= 초기화 & 시선 인터랙션 =================
    window.onload = () => {
      ["haru", "teacher", "bambi", "luna"].forEach(key => {
        document.getElementById(`preview-${key}`).innerHTML = characterSVGs[key];
      });

      const stage = document.getElementById("stageWrapper");
      stage.addEventListener("mousemove", (e) => {
        const actor = document.getElementById("characterActor");
        if (!actor) return;
        const rect = stage.getBoundingClientRect();
        const nx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        const ny = ((e.clientY - rect.top) / rect.height) * 2 - 1;

        actor.style.transform = `rotateY(${nx * 14}deg) rotateX(${-ny * 8}deg)`;
        const pupils = actor.querySelectorAll(".pupil");
        pupils.forEach(p => {
          p.style.transform = `translate(${nx * 2.5}px, ${ny * 2}px)`;
        });
      });

      stage.addEventListener("mouseleave", () => {
        const actor = document.getElementById("characterActor");
        if (!actor) return;
        actor.style.transform = "rotateY(0deg) rotateX(0deg)";
        actor.querySelectorAll(".pupil").forEach(p => {
          p.style.transform = "translate(0px, 0px)";
        });
      });
    };

    // ================= 대화 저장(localStorage) & 문맥 인식 엔진 =================
    let currentCharKey = null;
    let currentChar = null;
    let isTyping = false;
    let chatHistory = [];
    let lastTopic = null;

    function getStorageKey(charKey) {
      return `maumon_chat_${charKey}`;
    }

    function saveChatHistory() {
      if (!currentCharKey) return;
      localStorage.setItem(getStorageKey(currentCharKey), JSON.stringify({
        messages: chatHistory,
        lastTopic: lastTopic
      }));
    }

    function loadChatHistory(charKey) {
      const saved = localStorage.getItem(getStorageKey(charKey));
      if (saved) {
        try {
          return JSON.parse(saved);
        } catch (e) {
          return { messages: [], lastTopic: null };
        }
      }
      return { messages: [], lastTopic: null };
    }

    function clearChatHistory() {
      if (isTyping || !currentCharKey) return;
      if (!confirm(`${currentChar.name}와의 대화 기록을 모두 지울까요?`)) return;

      localStorage.removeItem(getStorageKey(currentCharKey));
      chatHistory = [];
      lastTopic = null;

      const chatBox = document.getElementById("chatBox");
      chatBox.innerHTML = "";
      showTypingAndReply(currentChar.greeting, "기본 인사 · Level 1", false);
    }

    function selectCharacter(charKey) {
      currentCharKey = charKey;
      currentChar = characters[charKey];

      document.getElementById("selectScreen").style.display = "none";
      document.getElementById("chatScreen").style.display = "flex";

      document.getElementById("topBar").style.background = currentChar.themeColor;
      document.getElementById("sendBtn").style.background = currentChar.themeColor;
      document.getElementById("headerName").innerText = currentChar.name;
      document.getElementById("headerRole").innerText = currentChar.role;
      document.getElementById("stageWrapper").style.background = currentChar.stageBg;
      document.getElementById("characterActor").innerHTML = characterSVGs[charKey];

      const savedData = loadChatHistory(charKey);
      chatHistory = savedData.messages || [];
      lastTopic = savedData.lastTopic || null;

      const chatBox = document.getElementById("chatBox");
      chatBox.innerHTML = "";

      if (chatHistory.length > 0) {
        chatHistory.forEach(msg => {
          if (msg.sender === "user") {
            renderUserBubble(msg.text);
          } else {
            renderBotBubble(msg.text, msg.tag, msg.isDanger);
          }
        });
      } else {
        showTypingAndReply(currentChar.greeting, "기본 인사 · Level 1", false);
      }
    }

    function goBack() {
      if (isTyping) return;
      document.getElementById("chatScreen").style.display = "none";
      document.getElementById("selectScreen").style.display = "flex";
    }

    function sendMessage() {
      if (isTyping) return;
      const input = document.getElementById("userInput");
      const text = input.value.trim();
      if (!text) return;

      appendUserMessage(text);
      input.value = "";

      const result = getSmartResponse(text);
      showTypingAndReply(result.reply, result.tag, result.isDanger);
    }

    function getSmartResponse(text) {
      const clean = text.replace(/[!?.,~ㅋㅎㅠㅜ\s]/g, "");

      const dangerWords = ["죽고", "사라지고", "자해", "끝내고", "살기싫", "자살"];
      if (dangerWords.some(w => clean.includes(w))) {
        return {
          tag: "긴급 위기 대응 매뉴얼 · Level 3",
          isDanger: true,
          reply: "잠깐만, 네가 지금 얼마나 힘들고 버거운지 느껴져서 정말 걱정이 돼. 이 힘든 마음을 절대 혼자서 감당하지 않았으면 좋겠어.<br><br>지금 바로 네 이야기를 들어줄 수 있는 전문 선생님께 연결해 줄게. 꼭 연락해 줘.<br>📞 <b>청소년 상담전화: 국번없이 1388 (24시간 무료)</b><br>📞 <b>자살예방 상담전화: 109</b>"
        };
      }

      const exactGreetings = ["안녕", "안녕하세요", "하이", "헬로", "반가워", "안뇽", "야", "저기", "있잖아"];
      if (exactGreetings.includes(clean) || clean.startsWith("안녕")) {
        return { tag: "일상 인사 · Level 1", isDanger: false, reply: currentChar.smallTalk.hi };
      }

      if (["잘지냈", "뭐해", "뭐하고", "어떻게지내", "기분어때"].some(w => clean.includes(w))) {
        return { tag: "일상 안부 · Level 1", isDanger: false, reply: currentChar.smallTalk.howAreYou };
      }

      if (["심심", "놀자", "그냥", "심심해"].some(w => clean.includes(w))) {
        return { tag: "일상 대화 · Level 1", isDanger: false, reply: currentChar.smallTalk.bored };
      }

      if (["고마워", "감사", "땡큐", "고맙"].some(w => clean.includes(w))) {
        return { tag: "일상 대화 · Level 1", isDanger: false, reply: currentChar.smallTalk.thanks };
      }

      if (["시험", "성적", "공부", "진로", "대학", "불안", "모의고사", "숙제", "학원", "점수"].some(w => text.includes(w))) {
        lastTopic = "study";
        return { tag: "학업·진로 매뉴얼 · Level 1", isDanger: false, reply: currentChar.manual.study };
      }

      if (["친구", "따돌림", "단톡", "싸웠", "외톨이", "관계", "손절", "애들", "반에서", "왕따"].some(w => text.includes(w))) {
        lastTopic = "friend";
        return { tag: "대인관계 매뉴얼 · Level 2", isDanger: false, reply: currentChar.manual.friend };
      }

      if (["부모님", "엄마", "아빠", "집", "가족", "잔소리", "동생", "언니", "오빠", "형"].some(w => text.includes(w))) {
        lastTopic = "family";
        return { tag: "가족 갈등 매뉴얼 · Level 2", isDanger: false, reply: currentChar.manual.family };
      }

      if (["피곤", "졸려", "잠", "지쳐", "힘들", "우울", "스트레스", "짜증"].some(w => text.includes(w))) {
        lastTopic = "tired";
        return { tag: "정서 안정 매뉴얼 · Level 2", isDanger: false, reply: currentChar.manual.tired };
      }

      if (lastTopic && (["어떻게", "모르겠", "막막", "맞아", "그래", "응", "어"].some(w => clean.includes(w)) || clean.length <= 4)) {
        const topicReply = currentChar.followUp[lastTopic];
        lastTopic = null;
        return { tag: "맥락 심화 상담 · Level 2", isDanger: false, reply: topicReply };
      }

      if (["응", "어", "맞아", "그래", "네", "예"].includes(clean)) {
        return { tag: "대화 이어가기 · Level 1", isDanger: false, reply: currentChar.smallTalk.yes };
      }
      if (["아니", "아뇨", "별로", "몰라", "글쎄"].includes(clean)) {
        return { tag: "대화 이어가기 · Level 1", isDanger: false, reply: currentChar.smallTalk.no };
      }
      if (clean.length <= 2) {
        return { tag: "대화 이어가기 · Level 1", isDanger: false, reply: currentChar.smallTalk.short };
      }

      const randomFallback = currentChar.fallback[Math.floor(Math.random() * currentChar.fallback.length)];
      return { tag: "정서 공감 매뉴얼 · Level 1", isDanger: false, reply: randomFallback };
    }

    function renderUserBubble(text) {
      const chatBox = document.getElementById("chatBox");
      const row = document.createElement("div");
      row.className = "msg-row user-row";
      row.innerHTML = `<div class="bubble user-bubble" style="background:${currentChar.themeColor}">${escapeHtml(text)}</div>`;
      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function renderBotBubble(replyHtml, tagText, isDanger) {
      const chatBox = document.getElementById("chatBox");
      const botRow = document.createElement("div");
      botRow.className = "msg-row bot-row";
      const bubbleClass = isDanger ? "bubble bot-bubble danger-bubble" : "bubble bot-bubble";
      botRow.innerHTML = `
        <span class="sender-label">${currentChar.name}</span>
        <div class="${bubbleClass}">
          <span class="tag">${tagText}</span><br>${replyHtml}
        </div>
      `;
      chatBox.appendChild(botRow);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendUserMessage(text) {
      renderUserBubble(text);
      chatHistory.push({ sender: "user", text: text });
      saveChatHistory();
    }

    function showTypingAndReply(replyHtml, tagText, isDanger) {
      isTyping = true;
      document.getElementById("sendBtn").disabled = true;
      document.getElementById("characterActor").classList.add("thinking");

      const statusPill = document.getElementById("statusPill");
      statusPill.innerText = `✍️ ${currentChar.name}가 답장 적는 중...`;
      statusPill.style.color = currentChar.themeColor;

      const chatBox = document.getElementById("chatBox");
      const typingRow = document.createElement("div");
      typingRow.className = "msg-row bot-row";
      typingRow.id = "typingIndicator";
      typingRow.innerHTML = `
        <span class="sender-label">${currentChar.name}</span>
        <div class="bubble bot-bubble typing-dots">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
      `;
      chatBox.appendChild(typingRow);
      chatBox.scrollTop = chatBox.scrollHeight;

      const delay = Math.min(1800, Math.max(900, replyHtml.length * 12));

      setTimeout(() => {
        const indicator = document.getElementById("typingIndicator");
        if (indicator) indicator.remove();

        document.getElementById("characterActor").classList.remove("thinking");
        statusPill.innerText = "● 이야기 듣는 중";
        statusPill.style.color = "#334155";

        renderBotBubble(replyHtml, tagText, isDanger);

        chatHistory.push({
          sender: "bot",
          text: replyHtml,
          tag: tagText,
          isDanger: isDanger
        });
        saveChatHistory();

        isTyping = false;
        document.getElementById("sendBtn").disabled = false;
        document.getElementById("userInput").focus();
      }, delay);
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.innerText = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
