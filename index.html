<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마음온(On) - 3D AI 심리 상담소</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    body {
      background: radial-gradient(circle at top left, #eef2ff, #fdf4ff, #fff7ed);
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; margin: 0; padding: 12px;
    }
    .app-container {
      width: 100%; max-width: 450px; height: 88vh; max-height: 780px;
      background: #ffffff; border-radius: 30px;
      box-shadow: 0 18px 45px rgba(30, 41, 59, 0.12);
      overflow: hidden; display: flex; flex-direction: column; position: relative;
      border: 1px solid #f1f5f9;
    }

    /* 1. 캐릭터 선택 화면 */
    .select-screen {
      flex: 1; padding: 24px 18px; display: flex; flex-direction: column;
      overflow-y: auto; background: linear-gradient(180deg, #fafbff 0%, #ffffff 100%);
    }
    .select-header { text-align: center; margin-bottom: 18px; }
    .select-header h2 { margin: 0 0 6px; font-size: 21px; color: #1e293b; letter-spacing: -0.5px; }
    .select-header p { margin: 0; font-size: 13px; color: #64748b; line-height: 1.45; }

    .char-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex: 1; }
    .char-card {
      background: #ffffff; border: 2px solid #f1f5f9; border-radius: 22px;
      padding: 12px 10px 14px; cursor: pointer; transition: 0.25s all ease;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.03);
    }
    .char-card:hover {
      transform: translateY(-4px); border-color: #818cf8;
      box-shadow: 0 12px 24px rgba(99, 102, 241, 0.15);
    }
    .card-3d-preview {
      width: 120px; height: 120px; border-radius: 18px;
      margin-bottom: 10px; overflow: hidden; position: relative;
    }
    .card-badge {
      font-size: 10.5px; font-weight: bold; padding: 3px 9px;
      border-radius: 12px; margin-bottom: 5px;
    }
    .char-card h3 { margin: 0 0 4px; font-size: 16px; color: #0f172a; }
    .char-card p { margin: 0; font-size: 11.5px; color: #64748b; line-height: 1.35; word-break: keep-all; }

    /* 2. 채팅 화면 */
    .chat-screen { display: none; flex-direction: column; height: 100%; }

    .top-bar {
      padding: 13px 16px; color: white; display: flex;
      align-items: center; justify-content: space-between; z-index: 5;
    }
    .top-bar-title { display: flex; align-items: center; gap: 6px; }
    .top-bar-title h3 { margin: 0; font-size: 16px; }
    .top-bar-title span {
      font-size: 10.5px; background: rgba(255,255,255,0.22);
      padding: 2px 8px; border-radius: 10px;
    }
    .top-bar-actions { display: flex; gap: 6px; }
    .change-btn {
      background: rgba(255,255,255,0.25); border: none; color: white;
      font-size: 11.5px; padding: 6px 10px; border-radius: 14px;
      cursor: pointer; font-weight: bold; transition: 0.2s;
    }
    .change-btn:hover { background: rgba(255,255,255,0.4); }

    /* 3D 캐릭터 무대 */
    .stage-3d-wrapper {
      height: 205px; width: 100%; position: relative;
      border-bottom: 1px solid #f1f5f9; overflow: hidden;
      cursor: grab;
    }
    .stage-3d-wrapper:active { cursor: grabbing; }
    #threeCanvasContainer { width: 100%; height: 100%; }
    .stage-hint {
      position: absolute; top: 10px; left: 14px;
      font-size: 10.5px; color: rgba(30, 41, 59, 0.65);
      background: rgba(255,255,255,0.78); padding: 3px 9px; border-radius: 10px;
      pointer-events: none;
    }
    .status-pill {
      position: absolute; bottom: 10px; right: 14px;
      background: rgba(255,255,255,0.94); color: #334155;
      font-size: 11px; padding: 4px 11px; border-radius: 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08); font-weight: bold;
      pointer-events: none;
    }

    /* 대화창 */
    .chat-box {
      flex: 1; padding: 16px 14px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 12px; background: #f8fafc;
    }
    .msg-row { display: flex; flex-direction: column; max-width: 82%; }
    .msg-row.bot-row { align-self: flex-start; }
    .msg-row.user-row { align-self: flex-end; align-items: flex-end; }
    .sender-label { font-size: 11px; color: #64748b; margin: 0 0 4px 6px; font-weight: bold; }
    .bubble {
      padding: 11px 15px; border-radius: 18px; font-size: 13.8px;
      line-height: 1.55; word-break: keep-all; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .bot-bubble { background: #ffffff; color: #1e293b; border-top-left-radius: 4px; border: 1px solid #e2e8f0; }
    .user-bubble { color: #ffffff; border-top-right-radius: 4px; }
    .tag {
      display: inline-block; font-size: 10px; font-weight: bold;
      padding: 2px 7px; border-radius: 6px; margin-bottom: 5px;
      background: #f1f5f9; color: #475569;
    }

    .danger-bubble { background: #fff5f5; border: 1.5px solid #ff6b6b; color: #c92a2a; }
    .danger-bubble .tag { background: #ff6b6b; color: white; }

    .typing-dots { display: flex; gap: 5px; padding: 13px 16px; align-items: center; }
    .dot { width: 7px; height: 7px; background: #94a3b8; border-radius: 50%; animation: bounce 1.3s infinite ease-in-out; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; } 40% { transform: scale(1.15); opacity: 1; } }

    .input-area {
      display: flex; padding: 11px 12px; background: #ffffff;
      border-top: 1px solid #e2e8f0; gap: 8px;
    }
    input {
      flex: 1; border: 1.5px solid #cbd5e1; border-radius: 22px;
      padding: 10px 16px; font-size: 14px; outline: none; transition: 0.2s;
    }
    input:focus { border-color: #6366f1; }
    .send-btn {
      border: none; border-radius: 22px; padding: 0 18px;
      color: white; font-weight: bold; font-size: 14px; cursor: pointer;
    }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 1. 캐릭터 선택 화면 -->
    <div class="select-screen" id="selectScreen">
      <div class="select-header">
        <h2>오늘 누구랑 이야기할까?</h2>
        <p>검증된 상담 매뉴얼을 바탕으로<br>네 마음을 따뜻하게 들어줄 친구를 선택해 줘!</p>
      </div>

      <div class="char-grid">
        <div class="char-card" onclick="selectCharacter('haru')">
          <div class="card-3d-preview" style="background:#e0f2fe;" id="preview-haru"></div>
          <span class="card-badge" style="background:#bae6fd; color:#0369a1;">동갑내기 단짝 친구</span>
          <h3>하루</h3>
          <p>"무조건 네 편이야! 편하게 반말로 다 털어놔."</p>
        </div>

        <div class="char-card" onclick="selectCharacter('teacher')">
          <div class="card-3d-preview" style="background:#dcfce7;" id="preview-teacher"></div>
          <span class="card-badge" style="background:#bbf7d0; color:#15803d;">다정한 상담 선생님</span>
          <h3>선생님</h3>
          <p>"혼자 고민하지 마세요. 선생님이 차분히 들어줄게요."</p>
        </div>

        <div class="char-card" onclick="selectCharacter('bambi')">
          <div class="card-3d-preview" style="background:#ffedd5;" id="preview-bambi"></div>
          <span class="card-badge" style="background:#fed7aa; color:#c2410c;">말랑한 아기 강아지</span>
          <h3>밤비</h3>
          <p>"꼬리 흔들며 기다렸어! 오늘 무슨 일 있었어?"</p>
        </div>

        <div class="char-card" onclick="selectCharacter('luna')">
          <div class="card-3d-preview" style="background:#f3e8ff;" id="preview-luna"></div>
          <span class="card-badge" style="background:#e9d5ff; color:#7e22ce;">차분한 달빛 고양이</span>
          <h3>루나</h3>
          <p>"복잡한 머릿속을 차분하게 정리해 줄게냥."</p>
        </div>
      </div>
    </div>

    <!-- 2. 채팅 화면 -->
    <div class="chat-screen" id="chatScreen">
      <div class="top-bar" id="topBar">
        <div class="top-bar-title">
          <h3 id="headerName">하루</h3>
          <span id="headerRole">동갑내기 단짝</span>
        </div>
        <div class="top-bar-actions">
          <button class="change-btn" onclick="clearChatHistory()">대화 초기화</button>
          <button class="change-btn" onclick="goBack()">캐릭터 바꾸기</button>
        </div>
      </div>

      <div class="stage-3d-wrapper" id="stageWrapper">
        <div class="stage-hint">↔ 좌우로 움직이면 입체로 반응해요</div>
        <div id="threeCanvasContainer"></div>
        <div class="status-pill" id="statusPill">● 이야기 듣는 중</div>
      </div>

      <div class="chat-box" id="chatBox"></div>

      <div class="input-area">
        <input type="text" id="userInput" placeholder="인사나 고민을 편하게 적어봐..." onkeypress="if(event.key==='Enter') sendMessage()" />
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">전송</button>
      </div>
    </div>
  </div>

  <script>
    // 캐릭터별 문맥 맞춤 대화 데이터베이스
    const characters = {
      haru: {
        name: "하루",
        role: "동갑내기 단짝 친구",
        themeColor: "#0284c7",
        stageBg: "linear-gradient(180deg, #e0f2fe 0%, #f0f9ff 100%)",
        greeting: "야호! 왔구나! 오늘 하루 어땠어? 그냥 심심해서 왔어도 좋고 고민 있어도 좋으니까 편하게 반말로 얘기해 봐!",
        smallTalk: {
          hi: "안녕! 반가워 ㅋㅋ 오늘 별일 없었어? 무슨 생각하고 있었어?",
          howAreYou: "나는 너 와서 기분 완전 최고지! 너는 오늘 컨디션 어때?",
          bored: "심심했구나? 나도 마침 너랑 수다 떨고 싶었는데 잘 왔다! 오늘 제일 재밌었거나 짜증 났던 일 하나만 말해봐!",
          thanks: "에이 뭐가 고마워~ 우리 사이에! 언제든 답답하면 또 찾아와, 내가 제일 먼저 달려올게!",
          yes: "응응! 그래서 그다음엔 어떻게 됐어? 편하게 계속 얘기해 줘!",
          no: "아하, 그렇구나! 그럼 요즘 머릿속에 제일 많이 떠오르는 생각은 뭐야?",
          short: "응응, 듣고 있어! 천천히 말해도 되니까 네 생각 편하게 다 꺼내봐."
        },
        followUp: {
          study: "맞아, 막상 시작하려고 하면 어디서부터 손대야 할지 막막하지. 지금 당장 책상 위에 있는 것 중에 5분만 볼 수 있는 거 하나만 골라볼까?",
          friend: "친구 일은 내 마음대로 안 돼서 더 답답하지... 네가 먼저 잘못한 게 아니라면 너무 자책하지 마. 오늘 하루는 네 기분 풀리는 일만 하자!",
          family: "가족이랑은 매일 얼굴 봐야 하니까 더 신경 쓰이지 ㅠㅠ 당장 다 해결하려 하지 말고, 오늘은 네 공간에서 잠깐 숨 돌리는 시간부터 갖자.",
          tired: "지금은 억지로 힘내려고 애쓰지 않아도 괜찮아. 물 한 잔 마시고 기지개 한 번 쭉 펴자! 내가 옆에 있어 줄게."
        },
        fallback: [
          "오 그렇구나! 좀 더 자세히 들려줄래? 네가 어떻게 느꼈는지 궁금해!",
          "음, 그런 일이 있었구나. 지금 네 기분은 어때? 편하게 다 털어놔도 돼!"
        ],
        manual: {
          study: "시험이랑 성적 때문에 진짜 숨 막히고 불안하지? ㅠㅠ 잘하고 싶은 마음이 크니까 긴장되는 건 당연한 거야! 오늘은 거창한 계획 말고, 딱 20분만 할 수 있는 제일 만만한 과목부터 같이 해보자. 내가 옆에서 응원할게!",
          friend: "헐, 친구 문제 때문에 진짜 속상하고 마음 복잡했겠다... 믿었던 친구한테 서운하면 하루 종일 아무것도 손에 안 잡히잖아. 지금은 네 마음이 다치지 않는 게 제일 중요해. 감정이 조금 가라앉으면 솔직하게 말해보거나 믿을 수 있는 어른께 도움을 청해보자!",
          family: "집에서 가족이랑 부딪히면 진짜 편히 쉴 곳이 없는 기분이라 너무 답답하지 ㅠㅠ 당장 부모님 생각을 바꾸긴 어려우니까, 오늘은 네 방에서 좋아하는 음악 들으면서 네 마음부터 먼저 달래주자. 넌 충분히 잘하고 있어!",
          tired: "요즘 잠도 잘 못 자고 계속 지치는구나... 몸이랑 마음이 다 방전된 상태면 작은 일도 훨씬 크게 느껴지잖아. 오늘은 숙제나 걱정 잠깐 내려놓고 30분만이라도 푹 쉬자!"
        }
      },
      teacher: {
        name: "선생님",
        role: "다정한 상담 선생님",
        themeColor: "#16a34a",
        stageBg: "linear-gradient(180deg, #dcfce7 0%, #f0fdf4 100%)",
        greeting: "어서 오세요, 반가워요. 가벼운 인사도 좋고 마음속 고민도 좋아요. 선생님이 편하게 들어줄게요.",
        smallTalk: {
          hi: "안녕하세요! 오늘 찾아와 줘서 반가워요. 오늘 하루 기분은 좀 어때요?",
          howAreYou: "선생님은 덕분에 아주 잘 지내고 있어요. 찾아와 준 여러분 이야기를 들을 때가 가장 보람차답니다. 오늘 컨디션은 어때요?",
          bored: "잠시 쉬어가고 싶었군요. 꼭 거창한 고민이 아니어도 괜찮아요. 요즘 학교생활에서 가장 신경 쓰이는 일이 있나요?",
          thanks: "고맙다고 말해줘서 선생님이 더 고마워요. 언제든 마음이 무거울 때 편하게 들러주세요.",
          yes: "그렇군요. 이야기를 조금 더 이어가 볼까요? 어떤 부분이 가장 마음에 걸리나요?",
          no: "알겠어요, 무리해서 말하지 않아도 괜찮아요. 편한 주제가 떠오르면 언제든 이야기해 주세요.",
          short: "네, 선생님이 천천히 듣고 있어요. 부담 갖지 말고 편한 대로 이야기해 주세요."
        },
        followUp: {
          study: "계획을 세우는 것조차 버거울 때가 있죠. 오늘은 공부를 많이 하는 것보다 책상에 10분 앉아 있는 것만으로도 충분히 잘한 거예요.",
          friend: "관계에서 상처를 받으면 다시 마음을 열기가 쉽지 않죠. 하지만 모든 사람과 잘 지내야만 하는 건 아니니, 스스로를 먼저 아껴주길 바라요.",
          family: "가까운 사이일수록 서운한 감정이 오래 남곤 해요. 오늘 당장 대화가 어렵다면 마음이 가라앉을 때까지 며칠 시간을 두는 것도 좋은 방법이에요.",
          tired: "지칠 때는 잠시 멈춰 서는 용기도 필요해요. 오늘 밤에는 스마트폰을 잠시 내려놓고 따뜻한 이불 속에서 푹 쉬어보세요."
        },
        fallback: [
          "그렇군요. 조금 더 자세히 이야기해 줄 수 있나요? 선생님이 함께 생각해 볼게요.",
          "말씀해 주셔서 고마워요. 그 상황에서 본인은 어떤 마음이 가장 컸나요?"
        ],
        manual: {
          study: "학업과 진로에 대한 불안감은 그만큼 성실하게 고민하고 있다는 증거이기도 해요. 하지만 모든 걸 한 번에 잘하려 하면 마음이 먼저 지치기 쉽답니다. 오늘은 지금 당장 실천할 수 있는 작은 목표 한 가지만 정해서 천천히 시작해 볼까요?",
          friend: "친구 관계에서 오는 갈등은 학교생활 전체를 힘들게 만들 만큼 큰 고민이죠. 하지만 상대방의 행동 때문에 스스로의 가치를 낮추지 않았으면 해요. 감정이 조금 진정된 뒤에 차분히 대화하거나, 필요하다면 언제든 선생님과 해결 방법을 같이 찾아봐요.",
          family: "가장 가까운 가족과 마음이 통하지 않을 때 느끼는 외로움이 참 크죠. 감정이 격해져 있을 때 대화하면 서로 상처가 되는 말만 오가기 쉬워요. 먼저 내가 어떤 부분에서 서운했는지 노트에 차분히 적어보면서 마음을 정리해 보는 건 어떨까요?",
          tired: "몸과 마음이 많이 지쳐 있는 것 같아 걱정이네요. 충분히 쉬지 못하면 감정도 예민해지기 쉬워요. 오늘은 스스로를 다그치지 말고 일찍 눈을 감고 휴식을 선물해 주세요."
        }
      },
      bambi: {

    // ================= 고퀄리티 입체 3D 캐릭터 생성 엔진 =================
    function build3DCharacterMesh(type) {
      const group = new THREE.Group();
      const mat = (color, rough = 0.38) => new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: 0.04 });

      function addExpressiveFace(headGroup, eyeY, eyeZ, cheekColor = 0xff8a80, isAnimal = false) {
        const eyeGeo = new THREE.SphereGeometry(0.115, 24, 24);
        const eyeMat = mat(0x1e293b, 0.1);
        const shine1 = new THREE.SphereGeometry(0.042, 12, 12);
        const shine2 = new THREE.SphereGeometry(0.02, 10, 10);
        const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

        [-0.3, 0.3].forEach(x => {
          const eye = new THREE.Mesh(eyeGeo, eyeMat);
          eye.scale.set(0.95, 1.1, 0.7);
          eye.position.set(x, eyeY, eyeZ);

          const s1 = new THREE.Mesh(shine1, whiteMat);
          s1.position.set(x + 0.032, eyeY + 0.038, eyeZ + 0.075);
          const s2 = new THREE.Mesh(shine2, whiteMat);
          s2.position.set(x - 0.028, eyeY - 0.028, eyeZ + 0.075);

          headGroup.add(eye, s1, s2);

          if (!isAnimal) {
            const brow = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.028, 0.03), mat(0x4a3228));
            brow.position.set(x, eyeY + 0.16, eyeZ - 0.02);
            brow.rotation.z = x < 0 ? 0.08 : -0.08;
            headGroup.add(brow);
          }
        });

        const cheekGeo = new THREE.SphereGeometry(0.13, 18, 18);
        const cheekMat = new THREE.MeshBasicMaterial({ color: cheekColor, transparent: true, opacity: 0.42 });
        [-0.46, 0.46].forEach(x => {
          const cheek = new THREE.Mesh(cheekGeo, cheekMat);
          cheek.scale.set(1.25, 0.65, 0.4);
          cheek.position.set(x, eyeY - 0.16, eyeZ - 0.08);
          headGroup.add(cheek);
        });

        if (!isAnimal) {
          const smile = new THREE.Mesh(new THREE.TorusGeometry(0.09, 0.022, 10, 20, Math.PI), mat(0xe11d48));
          smile.rotation.z = Math.PI;
          smile.position.set(0, eyeY - 0.2, eyeZ + 0.02);
          headGroup.add(smile);
        }
      }

      if (type === "haru") {
        const torso = new THREE.Mesh(new THREE.SphereGeometry(0.68, 32, 32), mat(0x38bdf8));
        torso.scale.set(1.05, 1.15, 0.85);
        torso.position.y = -1.15;
        group.add(torso);

        const hood = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.15, 18, 32), mat(0x0284c7));
        hood.rotation.x = Math.PI / 2.1;
        hood.position.y = -0.54;
        group.add(hood);

        [-0.68, 0.68].forEach((x, idx) => {
          const hand = new THREE.Mesh(new THREE.SphereGeometry(0.21, 20, 20), mat(0x38bdf8));
          hand.position.set(x, idx === 0 ? -1.18 : -0.95, 0.36);
          group.add(hand);
        });

        const headGroup = new THREE.Group();
        headGroup.position.y = 0.22;
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.82, 36, 36), mat(0xffdec2));
        headGroup.add(head);

        const hairBack = new THREE.Mesh(new THREE.SphereGeometry(0.87, 36, 36, 0, Math.PI * 2, 0, Math.PI * 0.62), mat(0x2d2424));
        hairBack.rotation.x = -0.22;
        headGroup.add(hairBack);

        const band = new THREE.Mesh(new THREE.TorusGeometry(0.91, 0.065, 14, 36, Math.PI), mat(0x1e293b));
        headGroup.add(band);
        [-0.88, 0.88].forEach(x => {
          const earCup = new THREE.Mesh(new THREE.SphereGeometry(0.25, 22, 22), mat(0x0ea5e9));
          earCup.scale.set(0.55, 1, 1);
          earCup.position.set(x, 0.02, 0);
          headGroup.add(earCup);
        });

        addExpressiveFace(headGroup, -0.04, 0.77, 0xff8a80, false);
        group.add(headGroup);
        group.userData.head = headGroup;

      } else if (type === "teacher") {
        const torso = new THREE.Mesh(new THREE.SphereGeometry(0.66, 32, 32), mat(0x34d399));
        torso.scale.set(1.05, 1.15, 0.84);
        torso.position.y = -1.15;
        group.add(torso);

        const collar = new THREE.Mesh(new THREE.SphereGeometry(0.38, 24, 24), mat(0xffffff));
        collar.scale.set(1.1, 0.6, 0.8);
        collar.position.set(0, -0.62, 0.28);
        group.add(collar);

        [-0.65, 0.65].forEach(x => {
          const hand = new THREE.Mesh(new THREE.SphereGeometry(0.2, 20, 20), mat(0x34d399));
          hand.position.set(x, -1.18, 0.34);
          group.add(hand);
        });

        const headGroup = new THREE.Group();
        headGroup.position.y = 0.22;
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.8, 36, 36), mat(0xffe2c6));
        headGroup.add(head);

        const hairTop = new THREE.Mesh(new THREE.SphereGeometry(0.85, 36, 36, 0, Math.PI * 2, 0, Math.PI * 0.58), mat(0x4a3228));
        hairTop.rotation.x = -0.15;
        const hairBack = new THREE.Mesh(new THREE.SphereGeometry(0.86, 32, 32), mat(0x4a3228));
        hairBack.scale.set(1.02, 1.18, 0.85);
        hairBack.position.set(0, -0.22, -0.2);
        headGroup.add(hairTop, hairBack);

        [-0.3, 0.3].forEach(x => {
          const rim = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.024, 14, 28), mat(0xd97706, 0.2));
          rim.position.set(x, -0.04, 0.8);
          headGroup.add(rim);
        });
        const bridge = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.2, 8), mat(0xd97706, 0.2));
        bridge.rotation.z = Math.PI / 2;
        bridge.position.set(0, -0.04, 0.81);
        headGroup.add(bridge);

        addExpressiveFace(headGroup, -0.04, 0.75, 0xffab91, false);
        group.add(headGroup);
        group.userData.head = headGroup;

      } else if (type === "bambi") {
        const body = new THREE.Mesh(new THREE.SphereGeometry(0.68, 32, 32), mat(0xfbbf24));
        body.scale.set(0.95, 1.12, 0.88);
        body.position.y = -1.12;
        group.add(body);

        const belly = new THREE.Mesh(new THREE.SphereGeometry(0.48, 24, 24), mat(0xfef3c7));
        belly.position.set(0, -1.12, 0.35);
        group.add(belly);

        const scarf = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.12, 16, 32), mat(0xf97316));
        scarf.rotation.x = Math.PI / 2;
        scarf.position.y = -0.52;
        group.add(scarf);

        [-0.42, 0.42].forEach(x => {
          const paw = new THREE.Mesh(new THREE.SphereGeometry(0.22, 20, 20), mat(0xfbbf24));
          paw.position.set(x, -1.38, 0.5);
          group.add(paw);
        });

        const headGroup = new THREE.Group();
        headGroup.position.y = 0.22;
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.84, 36, 36), mat(0xfbbf24));
        headGroup.add(head);

        const snout = new THREE.Mesh(new THREE.SphereGeometry(0.35, 24, 24), mat(0xfef3c7));
        snout.scale.set(1.15, 0.85, 0.9);
        snout.position.set(0, -0.18, 0.73);
        const nose = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), mat(0x291d18, 0.15));
        nose.position.set(0, -0.06, 0.98);
        headGroup.add(snout, nose);

        [-0.84, 0.84].forEach((x, idx) => {
          const ear = new THREE.Mesh(new THREE.SphereGeometry(0.32, 22, 22), mat(0xd97706));
          ear.scale.set(0.62, 1.48, 0.72);
          ear.position.set(x, -0.04, 0);
          ear.rotation.z = idx === 0 ? 0.28 : -0.28;
          headGroup.add(ear);
        });

        addExpressiveFace(headGroup, 0.06, 0.77, 0xff8a80, true);
        group.add(headGroup);
        group.userData.head = headGroup;

      } else if (type === "luna") {
        const body = new THREE.Mesh(new THREE.SphereGeometry(0.65, 32, 32), mat(0xc084fc));
        body.scale.set(0.92, 1.12, 0.86);
        body.position.y = -1.12;
        group.add(body);

        const chest = new THREE.Mesh(new THREE.SphereGeometry(0.45, 24, 24), mat(0xfaf5ff));
        chest.position.set(0, -1.12, 0.34);
        group.add(chest);

        const ribbon = new THREE.Mesh(new THREE.TorusGeometry(0.47, 0.09, 14, 30), mat(0xfacc15, 0.25));
        ribbon.rotation.x = Math.PI / 2;
        ribbon.position.y = -0.52;
        group.add(ribbon);

        [-0.4, 0.4].forEach(x => {
          const paw = new THREE.Mesh(new THREE.SphereGeometry(0.2, 20, 20), mat(0xfaf5ff));
          paw.position.set(x, -1.38, 0.48);
          group.add(paw);
        });

        const headGroup = new THREE.Group();
        headGroup.position.y = 0.22;
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.84, 36, 36), mat(0xc084fc));
        head.scale.set(1.06, 0.94, 0.96);
        headGroup.add(head);

        [-0.54, 0.54].forEach((x, idx) => {
          const ear = new THREE.Mesh(new THREE.ConeGeometry(0.32, 0.58, 22), mat(0xa855f7));
          ear.position.set(x, 0.78, 0);
          ear.rotation.z = idx === 0 ? 0.32 : -0.32;
          const innerEar = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.38, 18), mat(0xf472b6));
          innerEar.position.set(x, 0.74, 0.08);
          innerEar.rotation.z = idx === 0 ? 0.32 : -0.32;
          headGroup.add(ear, innerEar);
        });

        const nose = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), mat(0xf472b6));
        nose.position.set(0, -0.09, 0.83);
        headGroup.add(nose);

        [-1, 1].forEach(dir => {
          [-0.07, -0.17].forEach(y => {
            const whisker = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.42, 8), mat(0xffffff));
            whisker.rotation.z = Math.PI / 2 + (y * dir * 0.4);
            whisker.position.set(dir * 0.78, y, 0.56);
            headGroup.add(whisker);
          });
        });

        addExpressiveFace(headGroup, 0.02, 0.77, 0xf472b6, true);
        group.add(headGroup);
        group.userData.head = headGroup;
      }

      return group;
    }

    // 선택 카드용 미니 3D 프리뷰
    function renderCardPreviews() {
      ["haru", "teacher", "bambi", "luna"].forEach(type => {
        const container = document.getElementById(`preview-${type}`);
        container.innerHTML = "";
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
        camera.position.set(0, -0.2, 4.45);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(120, 120);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.82));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.65);
        dirLight.position.set(3, 5, 5);
        scene.add(dirLight);

        const mesh = build3DCharacterMesh(type);
        scene.add(mesh);

        function animatePreview() {
          requestAnimationFrame(animatePreview);
          mesh.rotation.y = Math.sin(Date.now() * 0.0022) * 0.28;
          mesh.position.y = Math.sin(Date.now() * 0.0032) * 0.05;
          renderer.render(scene, camera);
        }
        animatePreview();
      });
    }

    // 메인 3D 무대 관리
    let mainScene = null, mainCamera = null, mainRenderer = null, activeMesh = null;
    let animFrameId = null;
    let targetRotY = 0, targetRotX = 0;
    let isDragging = false, prevMouseX = 0;
    let isThinkingAnim = false;

    function initMain3DStage(charKey) {
      if (animFrameId) cancelAnimationFrame(animFrameId);
      const container = document.getElementById("threeCanvasContainer");
      container.innerHTML = "";

      const width = container.clientWidth || 450;
      const height = container.clientHeight || 205;

      mainScene = new THREE.Scene();
      mainCamera = new THREE.PerspectiveCamera(38, width / height, 0.1, 100);
      mainCamera.position.set(0, -0.25, 4.4);

      mainRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      mainRenderer.setSize(width, height);
      mainRenderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(mainRenderer.domElement);

      mainScene.add(new THREE.AmbientLight(0xffffff, 0.85));
      const keyLight = new THREE.DirectionalLight(0xffffff, 0.68);
      keyLight.position.set(4, 6, 6);
      const rimLight = new THREE.DirectionalLight(0xe0e7ff, 0.35);
      rimLight.position.set(-4, 2, -3);
      mainScene.add(keyLight, rimLight);

      activeMesh = build3DCharacterMesh(charKey);
      mainScene.add(activeMesh);

      const wrapper = document.getElementById("stageWrapper");
      wrapper.onmousedown = e => { isDragging = true; prevMouseX = e.clientX; };
      window.onmouseup = () => { isDragging = false; };
      wrapper.onmousemove = e => {
        if (isDragging) {
          targetRotY += (e.clientX - prevMouseX) * 0.015;
          prevMouseX = e.clientX;
        } else {
          const rect = wrapper.getBoundingClientRect();
          const nx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          const ny = ((e.clientY - rect.top) / rect.height) * 2 - 1;
          targetRotY = nx * 0.45;
          targetRotX = ny * 0.16;
        }
      };

      wrapper.ontouchstart = e => { isDragging = true; prevMouseX = e.touches[0].clientX; };
      wrapper.ontouchend = () => { isDragging = false; };
      wrapper.ontouchmove = e => {
        if (isDragging && e.touches[0]) {
          targetRotY += (e.touches[0].clientX - prevMouseX) * 0.018;
          prevMouseX = e.touches[0].clientX;
        }
      };

      function animateMain() {
        animFrameId = requestAnimationFrame(animateMain);
        if (!activeMesh || !mainRenderer) return;

        const t = Date.now() * 0.003;
        activeMesh.rotation.y += (targetRotY - activeMesh.rotation.y) * 0.09;
        if (activeMesh.userData.head) {
          activeMesh.userData.head.rotation.x += (targetRotX - activeMesh.userData.head.rotation.x) * 0.09;
        }

        if (isThinkingAnim) {
          activeMesh.position.y = Math.abs(Math.sin(t * 2.5)) * 0.15;
          if (activeMesh.userData.head) {
            activeMesh.userData.head.rotation.z = Math.sin(t * 2.5) * 0.11;
          }
        } else {
          activeMesh.position.y = Math.sin(t) * 0.05;
          if (activeMesh.userData.head) {
            activeMesh.userData.head.rotation.z *= 0.9;
          }
        }

        mainRenderer.render(mainScene, mainCamera);
      }
      animateMain();
    }

    window.onload = () => {
      renderCardPreviews();
    };

    // ================= 대화 저장(localStorage) & 문맥 인식 엔진 =================
    let currentCharKey = null;
    let currentChar = null;
    let isTyping = false;
    let chatHistory = []; // 현재 캐릭터 대화 내역
    let lastTopic = null; // 직전 대화 주제 기억 (study, friend, family, tired)

    function getStorageKey(charKey) {
      return `maumon_chat_${charKey}`;
    }

    function saveChatHistory() {
      if (!currentCharKey) return;
      localStorage.setItem(getStorageKey(currentCharKey), JSON.stringify({
        messages: chatHistory,
        lastTopic: lastTopic
      }));
    }

    function loadChatHistory(charKey) {
      const saved = localStorage.getItem(getStorageKey(charKey));
      if (saved) {
        try {
          return JSON.parse(saved);
        } catch (e) {
          return { messages: [], lastTopic: null };
        }
      }
      return { messages: [], lastTopic: null };
    }

    function clearChatHistory() {
      if (isTyping || !currentCharKey) return;
      if (!confirm(`${currentChar.name}와의 대화 기록을 모두 지울까요?`)) return;

      localStorage.removeItem(getStorageKey(currentCharKey));
      chatHistory = [];
      lastTopic = null;

      const chatBox = document.getElementById("chatBox");
      chatBox.innerHTML = "";
      showTypingAndReply(currentChar.greeting, "기본 인사 · Level 1", false);
    }

    function selectCharacter(charKey) {
      currentCharKey = charKey;
      currentChar = characters[charKey];
      targetRotY = 0;
      targetRotX = 0;

      document.getElementById("selectScreen").style.display = "none";
      document.getElementById("chatScreen").style.display = "flex";

      document.getElementById("topBar").style.background = currentChar.themeColor;
      document.getElementById("sendBtn").style.background = currentChar.themeColor;
      document.getElementById("headerName").innerText = currentChar.name;
      document.getElementById("headerRole").innerText = currentChar.role;
      document.getElementById("stageWrapper").style.background = currentChar.stageBg;

      setTimeout(() => initMain3DStage(charKey), 30);

      // 저장된 대화 내역 불러오기
      const savedData = loadChatHistory(charKey);
      chatHistory = savedData.messages || [];
      lastTopic = savedData.lastTopic || null;

      const chatBox = document.getElementById("chatBox");
      chatBox.innerHTML = "";

      if (chatHistory.length > 0) {
        // 기존 대화 복원
        chatHistory.forEach(msg => {
          if (msg.sender === "user") {
            renderUserBubble(msg.text);
          } else {
            renderBotBubble(msg.text, msg.tag, msg.isDanger);
          }
        });
      } else {
        // 첫 방문 시 인사말 출력 및 저장
        showTypingAndReply(currentChar.greeting, "기본 인사 · Level 1", false);
      }
    }

    function goBack() {
      if (isTyping) return;
      if (animFrameId) cancelAnimationFrame(animFrameId);
      activeMesh = null;
      document.getElementById("chatScreen").style.display = "none";
      document.getElementById("selectScreen").style.display = "flex";
    }

    function sendMessage() {
      if (isTyping) return;
      const input = document.getElementById("userInput");
      const text = input.value.trim();
      if (!text) return;

      appendUserMessage(text);
      input.value = "";

      const result = getSmartResponse(text);
      showTypingAndReply(result.reply, result.tag, result.isDanger);
    }

    function getSmartResponse(text) {
      // 문장부호, 초성 등 제거한 순수 텍스트
      const clean = text.replace(/[!?.,~ㅋㅎㅠㅜ\s]/g, "");

      // 1. Level 3: 긴급 위기 키워드 감지 (최우선)
      const dangerWords = ["죽고", "사라지고", "자해", "끝내고", "살기싫", "자살"];
      if (dangerWords.some(w => clean.includes(w))) {
        return {
          tag: "긴급 위기 대응 매뉴얼 · Level 3",
          isDanger: true,
          reply: "잠깐만, 네가 지금 얼마나 힘들고 버거운지 느껴져서 정말 걱정이 돼. 이 힘든 마음을 절대 혼자서 감당하지 않았으면 좋겠어.<br><br>지금 바로 네 이야기를 들어줄 수 있는 전문 선생님께 연결해 줄게. 꼭 연락해 줘.<br>📞 <b>청소년 상담전화: 국번없이 1388 (24시간 무료)</b><br>📞 <b>자살예방 상담전화: 109</b>"
        };
      }

      // 2. 가벼운 인사 문맥 처리 ("안녕?", "안녕", "하이", "반가워", "야" 등)
      const exactGreetings = ["안녕", "안녕하세요", "하이", "헬로", "반가워", "안뇽", "야", "저기", "있잖아"];
      if (exactGreetings.includes(clean) || clean.startsWith("안녕")) {
        return { tag: "일상 인사 · Level 1", isDanger: false, reply: currentChar.smallTalk.hi };
      }

      // 3. 안부 묻기 ("잘 지냈어?", "뭐해?", "어떻게 지내?")
      if (["잘지냈", "뭐해", "뭐하고", "어떻게지내", "기분어때"].some(w => clean.includes(w))) {
        return { tag: "일상 안부 · Level 1", isDanger: false, reply: currentChar.smallTalk.howAreYou };
      }

      // 4. 심심함/일상 수다 문맥 처리
      if (["심심", "놀자", "그냥", "심심해"].some(w => clean.includes(w))) {
        return { tag: "일상 대화 · Level 1", isDanger: false, reply: currentChar.smallTalk.bored };
      }

      // 5. 감사 인사 문맥 처리
      if (["고마워", "감사", "땡큐", "고맙"].some(w => clean.includes(w))) {
        return { tag: "일상 대화 · Level 1", isDanger: false, reply: currentChar.smallTalk.thanks };
      }

      // 6. RAG 전문 상담 매뉴얼 검색 (주제 업데이트 포함)
      if (["시험", "성적", "공부", "진로", "대학", "불안", "모의고사", "숙제", "학원", "점수"].some(w => text.includes(w))) {
        lastTopic = "study";
        return { tag: "학업·진로 매뉴얼 · Level 1", isDanger: false, reply: currentChar.manual.study };
      }

      if (["친구", "따돌림", "단톡", "싸웠", "외톨이", "관계", "손절", "애들", "반에서", "왕따"].some(w => text.includes(w))) {
        lastTopic = "friend";
        return { tag: "대인관계 매뉴얼 · Level 2", isDanger: false, reply: currentChar.manual.friend };
      }

      if (["부모님", "엄마", "아빠", "집", "가족", "잔소리", "동생", "언니", "오빠", "형"].some(w => text.includes(w))) {
        lastTopic = "family";
        return { tag: "가족 갈등 매뉴얼 · Level 2", isDanger: false, reply: currentChar.manual.family };
      }

      if (["피곤", "졸려", "잠", "지쳐", "힘들", "우울", "스트레스", "짜증"].some(w => text.includes(w))) {
        lastTopic = "tired";
        return { tag: "정서 안정 매뉴얼 · Level 2", isDanger: false, reply: currentChar.manual.tired };
      }

      // 7. 직전 주제가 있는 상태에서 후속 반응("응", "맞아", "어떻게 해야 할지 모르겠어" 등)을 보일 때 문맥 연결
      if (lastTopic && (["어떻게", "모르겠", "막막", "맞아", "그래", "응", "어"].some(w => clean.includes(w)) || clean.length <= 4)) {
        const topicReply = currentChar.followUp[lastTopic];
        lastTopic = null; // 한 번 이어간 후 초기화
        return { tag: "맥락 심화 상담 · Level 2", isDanger: false, reply: topicReply };
      }

      // 8. 긍정/부정 짧은 대답 처리
      if (["응", "어", "맞아", "그래", "네", "예"].includes(clean)) {
        return { tag: "대화 이어가기 · Level 1", isDanger: false, reply: currentChar.smallTalk.yes };
      }
      if (["아니", "아뇨", "별로", "몰라", "글쎄"].includes(clean)) {
        return { tag: "대화 이어가기 · Level 1", isDanger: false, reply: currentChar.smallTalk.no };
      }
      if (clean.length <= 2) {
        return { tag: "대화 이어가기 · Level 1", isDanger: false, reply: currentChar.smallTalk.short };
      }

      // 9. 일반 서술 문장일 때 자연스럽게 질문 유도
      const randomFallback = currentChar.fallback[Math.floor(Math.random() * currentChar.fallback.length)];
      return { tag: "정서 공감 매뉴얼 · Level 1", isDanger: false, reply: randomFallback };
    }

    function renderUserBubble(text) {
      const chatBox = document.getElementById("chatBox");
      const row = document.createElement("div");
      row.className = "msg-row user-row";
      row.innerHTML = `<div class="bubble user-bubble" style="background:${currentChar.themeColor}">${escapeHtml(text)}</div>`;
      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function renderBotBubble(replyHtml, tagText, isDanger) {
      const chatBox = document.getElementById("chatBox");
      const botRow = document.createElement("div");
      botRow.className = "msg-row bot-row";
      const bubbleClass = isDanger ? "bubble bot-bubble danger-bubble" : "bubble bot-bubble";
      botRow.innerHTML = `
        <span class="sender-label">${currentChar.name}</span>
        <div class="${bubbleClass}">
          <span class="tag">${tagText}</span><br>${replyHtml}
        </div>
      `;
      chatBox.appendChild(botRow);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendUserMessage(text) {
      renderUserBubble(text);
      chatHistory.push({ sender: "user", text: text });
      saveChatHistory();
    }

    function showTypingAndReply(replyHtml, tagText, isDanger) {
      isTyping = true;
      isThinkingAnim = true;
      document.getElementById("sendBtn").disabled = true;

      const statusPill = document.getElementById("statusPill");
      statusPill.innerText = `✍️ ${currentChar.name}가 답장 적는 중...`;
      statusPill.style.color = currentChar.themeColor;

      const chatBox = document.getElementById("chatBox");
      const typingRow = document.createElement("div");
      typingRow.className = "msg-row bot-row";
      typingRow.id = "typingIndicator";
      typingRow.innerHTML = `
        <span class="sender-label">${currentChar.name}</span>
        <div class="bubble bot-bubble typing-dots">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
      `;
      chatBox.appendChild(typingRow);
      chatBox.scrollTop = chatBox.scrollHeight;

      const delay = Math.min(1800, Math.max(900, replyHtml.length * 12));

      setTimeout(() => {
        const indicator = document.getElementById("typingIndicator");
        if (indicator) indicator.remove();

        isThinkingAnim = false;
        statusPill.innerText = "● 이야기 듣는 중";
        statusPill.style.color = "#334155";

        renderBotBubble(replyHtml, tagText, isDanger);

        // 봇 응답 저장
        chatHistory.push({
          sender: "bot",
          text: replyHtml,
          tag: tagText,
          isDanger: isDanger
        });
        saveChatHistory();

        isTyping = false;
        document.getElementById("sendBtn").disabled = false;
        document.getElementById("userInput").focus();
      }, delay);
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.innerText = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
